<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00453A">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<!-- 홈 화면에 설치했을 때 주소창·하단 메뉴바 없이 앱처럼 뜨게 하는 설정 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="방문체크">
<meta name="application-name" content="방문체크">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>하나은행 방문관리 체크표</title>
<style>
:root{
  --hana:#00806B;--hana-deep:#004E41;--hana-mid:#0E9E86;
  --mint:#E9F4F0;--line:#DDE8E4;--ink:#12201C;--sub:#5E726B;
  --amber:#B0791F;--bg:#F3F6F5;--red:#B4402F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  max-width:760px;margin:0 auto;min-height:100vh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
/* ── 상단 그린 헤더 ── */
.hero{position:relative;overflow:hidden;color:#fff;padding:calc(15px + env(safe-area-inset-top)) 18px 48px;
  background:linear-gradient(152deg,#00453A 0%,#006A57 56%,#0E9E86 100%)}
.hero:after{content:"";position:absolute;right:-52px;top:-64px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero:before{content:"";position:absolute;right:22px;top:74px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.05)}
.brand{position:relative;display:flex;align-items:center;gap:7px;font-size:11px;color:#C9E6DE;letter-spacing:.01em}
.brand b{color:#fff;font-weight:700}
.brand i{width:1px;height:10px;background:rgba(255,255,255,.32);display:block}
.badge{margin-left:auto;position:relative;display:inline-block;line-height:1;white-space:nowrap;
  text-box-trim:trim-both;text-box-edge:cap alphabetic;padding:7.75px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3)}
h1{position:relative;margin:13px 0 4px;font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.hero-sub{position:relative;margin:0;font-size:11.5px;line-height:1.5;color:#BEE0D7}
/* ── 요약 카드 ── */
.summary{position:relative;z-index:2;margin:-32px 14px 0;background:#fff;border-radius:16px;
  padding:13px 15px 11px;box-shadow:0 10px 24px rgba(2,48,40,.13),0 1px 0 rgba(0,0,0,.02);border:1px solid #EBF2EF}
.nums{display:flex;align-items:flex-end;gap:15px}
.num{display:flex;flex-direction:column;justify-content:flex-end;gap:0}
.num b{display:block;height:22px;line-height:22px;font-size:22px;font-weight:800;letter-spacing:-.03em;font-feature-settings:"tnum"}
.num span{display:block;height:14px;line-height:14px;font-size:10px;color:var(--sub);font-weight:500;white-space:nowrap}
.num.done b{color:var(--hana)}
.num.left b{color:#9A6412}
.pct{margin-left:auto;text-align:right;line-height:1.1}
.pct b{display:block;height:20px;line-height:20px;font-size:18px;font-weight:800;color:var(--hana);letter-spacing:-.03em}
.pct span{display:block;height:13px;line-height:13px;font-size:9.5px;color:var(--sub)}
.bar{height:8px;border-radius:99px;background:#E4EFEA;margin:11px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#39C4A6,#00806B);
  transition:width .38s cubic-bezier(.3,.9,.3,1)}
.sumnote{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;color:var(--sub);line-height:1.4}
.sumnote b{font-weight:600;color:#3F5A53}
/* ── 탭 + 목록/지도 전환 + 검색 (스크롤해도 위에 붙음) ── */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px}
.vrow{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.viewtog{display:flex;gap:2px;background:#E7EFEC;border:1px solid var(--line);border-radius:999px;padding:2px}
.vt{display:flex;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;font:inherit;
  font-size:11.5px;font-weight:700;color:#4A655D;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.vt svg{width:12px;height:12px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linejoin:round}
.vt.on{background:#fff;color:var(--hana-deep);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.vhint{margin-left:auto;font-size:9.5px;color:var(--sub);line-height:1.3;text-align:right}
.tabs{display:flex;gap:5px;padding:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:#456059;font:inherit;font-size:11.5px;font-weight:600;white-space:nowrap}
.tab b{font-size:9.5px;font-weight:700;color:#6C837B;margin-left:4px}
.tab.on{background:var(--hana-deep);border-color:var(--hana-deep);color:#fff;box-shadow:0 4px 10px rgba(0,78,65,.22)}
.tab.on b{color:rgba(255,255,255,.8)}
.search{display:flex;align-items:center;gap:7px;margin-top:8px;height:38px;padding:0 11px;
  background:#fff;border:1px solid var(--line);border-radius:11px}
.search>svg{width:15px;height:15px;flex:0 0 auto;stroke:#7D918A;fill:none;stroke-width:2}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink);padding:0;height:100%}
.search input:focus{outline:none}
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration{display:none}
#q-clear{flex:0 0 auto;width:20px;height:20px;border:0;border-radius:50%;background:#EDF3F1;color:#5E726B;
  font:inherit;font-size:12px;line-height:1;padding:0;cursor:pointer;display:none}
#q-clear.on{display:block}
.sresult{display:flex;justify-content:space-between;gap:8px;padding:7px 2px 0;font-size:10px;color:var(--sub);line-height:1.4}
.sresult b{font-weight:600;color:#3F5A53}
.sresult[hidden]{display:none}
/* ── 카드 목록 ── */
#list{display:flex;flex-direction:column;gap:9px;padding:4px 14px 8px}
#list[hidden],#searchrow[hidden],#mapview[hidden]{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px;
  transition:background .18s,border-color .18s,box-shadow .18s}
.card.done{background:#F1FAF6;border-color:#A6DCC8}
.card.pending{box-shadow:0 0 0 2px rgba(0,128,107,.12)}
.card-top{display:flex;gap:10px;align-items:flex-start}
.check{flex:0 0 auto;width:46px;height:46px;padding:0;display:grid;place-items:center;cursor:pointer;
  border-radius:13px;border:2px solid #BBD1CA;background:#fff;transition:.18s}
.check svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transform:scale(.55);transition:.18s}
.check:active{transform:scale(.95)}
.card.done .check{background:linear-gradient(145deg,#14AB8D,#00796A);border-color:#00796A;box-shadow:0 4px 10px rgba(0,121,106,.22)}
.card.done .check svg{opacity:1;transform:scale(1)}
.info{min-width:0;flex:1;padding-top:1px}
.seq{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:21px;padding:0 6px;margin-right:4px;
  border-radius:6px;background:#DCEEE7;border:1px solid #B7D9CD;color:#0E4E43;
  font-size:11.5px;font-weight:800;line-height:1;letter-spacing:.01em;font-feature-settings:"tnum"}
.card.done .seq{background:#fff;border-color:#9FD3C1;color:#0B5B4E}
.name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 4px;font-size:15px;font-weight:700;
  line-height:1.3;letter-spacing:-.02em;color:var(--ink)}
.card.done .name{color:#3D7A6B}
.chip{flex:0 0 auto;font-size:9.5px;font-weight:700;line-height:1.25;color:var(--amber);
  background:#FBF2E1;border:1px solid #F0E2C6;border-radius:5px;padding:2px 5px}
.chip.date{color:#0B7F6B;background:var(--mint);border-color:#CBE7DC}
/* 중개사 상호 — 누르면 잔금 이력이 뜬다(점선 밑줄로만 살짝 알린다) */
.nm{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;margin:0;padding:0;
  cursor:pointer;text-align:left;border-bottom:1px dotted rgba(0,128,107,.5);
  -webkit-tap-highlight-color:transparent}
.nm:active{opacity:.55}
.card.done .nm{border-bottom-color:rgba(61,122,107,.42)}
.meta{margin:0;font-size:10.5px;line-height:1.55;color:var(--sub)}
.meta span{display:block}
.meta .wk{color:#3F5A53;font-weight:600}
.meta .tel-no{color:#00695A;font-weight:600;font-feature-settings:"tnum";letter-spacing:.01em}
.meta .note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  white-space:pre-line;color:#7C8E87;margin-top:1px}
.vdslot{display:block;margin:6px 0 0;min-width:0}
.vdslot:empty{display:none}
/* 1차·2차·3차 알약은 모바일(344~390px)에서도 절대 두 줄로 떨어지지 않게 한 줄 고정 */
.vdate-row{display:flex;flex-wrap:nowrap;align-items:center;gap:3px;min-width:0;max-width:100%;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch}
.vdate-row::-webkit-scrollbar{display:none;width:0;height:0}
button.vdate{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;height:19px;font-family:inherit;font-size:10.5px;font-weight:600;line-height:1;
  letter-spacing:-.02em;color:#0B7F6B;background:var(--mint);border:1px solid #CBE7DC;
  border-radius:999px;padding:0 6px;cursor:pointer;font-feature-settings:"tnum"}
.card.done button.vdate{color:#2F6E5E;background:#DFF1E9;border-color:#CFE7DC}
button.vdate:active{background:#D3EBE2;transform:scale(.97)}
button.vdate{position:relative}
/* 손가락이 닿는 높이를 아래로만 넓힌다(위는 메타 글자·아래는 버튼 줄과 겹치지 않게) */
button.vdate:after{content:"";position:absolute;left:0;right:0;top:-2px;bottom:-8px;border-radius:999px}
button.vdate.add{color:#5E8077;background:#fff;border:1px dashed #BCD5CD;font-weight:700;padding:0 5px}
/* 날짜 입력칸 — 모바일 날짜 선택기와 직접 입력이 모두 되도록 input[type=date] */
.vdedit{display:flex;align-items:center;gap:4px;margin:1px 0 0;flex-wrap:nowrap;min-width:0}
.vdate-inp{flex:1 1 auto;min-width:0;width:auto;height:30px;padding:0 4px;border:1px solid #BFDCD2;
  border-radius:7px;background:#fff;font-family:inherit;font-size:12px;line-height:1.2;color:var(--ink);
  -webkit-appearance:auto;appearance:auto}
.vdate-inp:focus{outline:none;border-color:#56B79B;box-shadow:0 0 0 3px rgba(21,171,141,.12)}
.vbtn{flex:0 0 auto;height:30px;padding:0 8px;border-radius:7px;border:1px solid #CFE0DA;background:#fff;
  font-family:inherit;font-size:11px;font-weight:700;color:#3F5A53;cursor:pointer;white-space:nowrap}
.vbtn.save{background:var(--hana-deep);border-color:var(--hana-deep);color:#fff}
.vbtn.del{color:#A6402F;border-color:#E7D2CC;background:#FFFCFB}
.vbtn:active{transform:scale(.97)}
/* 지도 하단 카드의 방문일 — 카드가 좁으니 위 여백만 조금 줄인다 */
.mc-info .vdslot{margin:3px 0 0}
.acts{display:flex;gap:6px;margin-top:9px}
.btn{flex:1;height:37px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:10px;
  border:1px solid #D6E4DF;background:#fff;color:#2C544A;font-size:11.5px;font-weight:600;text-decoration:none}
.btn .ico{width:14px;height:14px;flex:0 0 auto}
.btn.tel{border-color:#BCDBD1;color:#00695A;background:#FAFDFC}
.btn.off{color:#A6B6B1;border-style:dashed;background:#FBFCFC}
.btn:active{transform:scale(.985);background:#F3F8F6}
.memo{width:100%;margin-top:8px;padding:9px 10px;border-radius:9px;border:1px solid #E1EBE7;background:#FBFDFC;
  font:inherit;font-size:11.5px;color:var(--ink)}
/* ── 잔금 카드 (잔금 탭) ── */
.chkcol{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px}
.chkcap{font-size:8.5px;font-weight:600;line-height:1.1;color:var(--sub);letter-spacing:-.02em;white-space:nowrap}
.card.done .chkcap{color:#0B5B4E}
.when{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:6px;
  background:var(--mint);border:1px solid #CBE7DC;color:#0B7F6B;font-size:10.5px;font-weight:800;
  letter-spacing:-.01em;font-feature-settings:"tnum";white-space:nowrap}
.when.t{background:#fff;border-color:#DDE8E4;color:#4C635C;font-weight:700}
.cust{font-style:normal;font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.card.done .cust{color:#3D7A6B}
.broker{margin:1px 0 5px;font-size:12px;font-weight:600;line-height:1.3;color:#2C544A}
.broker .none{color:#A5B7B1;font-weight:500}
.blines{display:grid;grid-template-columns:52px minmax(0,1fr);gap:1px 6px;margin:0;
  font-size:10.5px;line-height:1.5;font-weight:600;color:#3F5A53}
.blines b{font-weight:500;color:#8B9C95}
.blines i{font-style:normal;word-break:break-all}
.blines i.amt{color:#0B5B4E;font-weight:800;font-feature-settings:"tnum"}
.cond{margin:4px 0 0;font-size:10px;line-height:1.45;color:#7C8E87;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
/* 잔금후방문 — 잔금완료(초록) 바로 아래에 같은 크기(46×46·모서리 13·테두리 2px)로 세로로 쌓고,
   초록과 확실히 갈리도록 앰버 계열(미체크 실선·크림 바탕, 체크 시 진한 주황)로 둔다.
   미체크도 잔금완료와 같은 실선(점선 아님)으로 맞춘다. */
.chkcol .bchk{margin-top:7px}
.bchk{flex:0 0 auto;width:46px;height:46px;padding:0;display:grid;place-items:center;
  border-radius:13px;border:2px solid #E2A75A;background:#FFFCF4;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background .18s,border-color .18s,box-shadow .18s}
.bchk svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transform:scale(.55);transition:.18s}
.bchk.on{border-style:solid;border-color:#B45309;background:linear-gradient(145deg,#EE9012,#B45309);
  box-shadow:0 4px 10px rgba(180,83,9,.22)}
.bchk.on svg{opacity:1;transform:scale(1)}
.bchk:active{transform:scale(.95)}
/* 라벨 '잔금 후 방문' — 46px 버튼 폭 안에 한 줄로 들어가게 글자만 조금 줄이고 가운데 정렬 */
.chkcap.aft,.card.done .chkcap.aft{color:#8A520E;text-align:center;font-size:8px;letter-spacing:-.03em}
.chkcap.aft.on{color:#7A3E06;font-weight:700}
.memo::placeholder{color:#A5B7B1}
.memo:focus{outline:none;border-color:#8ACBB8;background:#fff;box-shadow:0 0 0 3px rgba(21,171,141,.1)}
.sec{display:flex;align-items:center;gap:7px;margin:10px 2px 1px;font-size:10px;font-weight:700;color:#6D8279;letter-spacing:.02em}
/* 구분선이 있으면 목록 첫 줄에 바짝 붙이고, 둘 사이 구분선은 카드와의 간격만 살짝 둔다 */
.sec:first-child{margin:-7px 2px 1px}   /* '전체 N곳' 줄과의 간격 12px → 5px */
.sec:not(:first-child){margin:6px 2px 0}
.sec:before,.sec:after{content:"";height:1px;background:#DFE9E5;flex:1}
.empty{padding:34px 18px;text-align:center;font-size:12px;color:var(--sub);line-height:1.6}
.foot{margin:2px 16px 18px;font-size:9.5px;line-height:1.6;color:#869891;text-align:center}
/* ── 지도 ── */
#mapview{padding:0 14px 6px}
/* 하단 카드가 열린 동안은 지도가 카드 위에서 끝나므로 아래 여백을 따로 잡지 않는다 */
body.mc-open #mapview{padding-bottom:6px}
/* 카드가 열린 지도 화면은 한 화면에 다 들어가게 두어 스크롤로 어긋나지 않게 한다 */
body.mc-open{padding-bottom:0}
#map{height:calc(100vh - 430px);height:calc(100dvh - 430px);min-height:290px;max-height:600px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);background:#E8EEEB}
/* 카드가 열리면 지도 아래 끝이 카드 위 끝에 닿도록 줄인다.
   실제 값은 JS(fitMapBox)가 카드 높이·지도 위치를 실측해 인라인으로 덮어쓴다 —
   여기 값은 JS 가 돌기 전 한 순간의 기본값이다. */
body.mc-open #map{height:calc(100vh - 503px);height:calc(100dvh - 503px);min-height:200px;max-height:600px}
.mapnote{margin:8px 2px 0;font-size:10.5px;line-height:1.5;color:var(--sub)}
.mapnote b{color:#3F5A53}
.mapnote a{color:var(--hana)}
.maplegend{display:flex;gap:10px;align-items:center;margin:7px 2px 0;font-size:9.5px;color:var(--sub)}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* 지도 위 '내 위치' 버튼 · 파란 점 마커 */
.mapwrap{position:relative}
.mylocbtn{position:absolute;right:10px;bottom:10px;z-index:5;display:inline-flex;align-items:center;gap:4px;
  height:30px;padding:0 10px 0 8px;border:1px solid #CFE0DA;border-radius:999px;background:#fff;
  font:inherit;font-size:11px;font-weight:700;letter-spacing:-.01em;color:#00695A;cursor:pointer;
  box-shadow:0 2px 8px rgba(2,48,40,.22)}
.mylocbtn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.mylocbtn:active{background:#F0F8F5}
.mylocbtn.wait{color:#8A9C95}
.mylocbtn.off{display:none}
/* 지도가 카드 위에서 끝나므로 버튼은 늘 지도 오른쪽 아래(10px)에 그대로 둔다 */
.meloc{position:relative;width:16px;height:16px;pointer-events:none}
.meloc i,.meloc b{position:absolute;left:50%;top:50%;border-radius:50%}
.meloc i{width:16px;height:16px;margin:-8px 0 0 -8px;background:rgba(26,115,232,.42);
  animation:melocPulse 2s ease-out infinite}
.meloc b{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border:2.5px solid #fff;background:#1A73E8;
  box-shadow:0 1px 4px rgba(0,0,0,.4)}
