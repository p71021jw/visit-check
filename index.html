    selKey: '',
    center: null,
    /* 내 위치 추적 */
    watchId: null,
    myPos: null,
    myOverlay: null,
    myDenied: false,
    wantPan: false
  };

  /* ── 작은 도우미 ──────────────────────────────────── */
  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function firstLine(s) { return String(s || '').split('\n')[0]; }

  function keyOf(it) {
    if (it.type === 'regular') return 'r' + it.row;
    if (it.type === 'balance') return 'b' + it.row;
    return 'i' + it.row;
  }

  function hhmm() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  /** '2026-11-26(목)' → '11/26(목)' */
  function shortDate(s) {
    var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
    return m ? (m[2] + '/' + m[3] + m[4]).trim() : String(s || '');
  }

  /** 방문일 값을 'YYYY-MM-DD'로 맞춰 준다.
      시트 K·O·P열이 날짜 서식이던 시절 값은 46353 같은 시리얼 숫자로 내려온다.
      그대로 두면 알약에 '46353'이 찍히고 수정칸도 비어 버리므로, 5자리 시리얼
      (40000 ≈ 2009년 ~ 70000 ≈ 2091년)만 날짜로 되돌리고 나머지는 그대로 둔다.
      25569 = 1970-01-01 (엑셀·시트 시리얼 날짜 기준). */
  function normVisitDate(v) {
    if (v === null || v === undefined || v === '') return '';
    var s = String(v).trim();
    var n = (typeof v === 'number' || /^\d{5}(\.0+)?$/.test(s)) ? Number(v) : NaN;
    if (isFinite(n) && n >= 40000 && n <= 70000) {
      var d = new Date(Math.round((Math.floor(n) - 25569) * 86400000));
      return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' +
        ('0' + d.getUTCDate()).slice(-2);
    }
    return s;
  }

  /** 방문일 알약용 짧은 날짜 — 올해면 '11.19', 다른 해면 '25.01.15' */
  function shortDay(s) {
    var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return String(s || '');
    if (m[1] === String(new Date().getFullYear())) return m[2] + '.' + m[3];
    return m[1].substr(2) + '.' + m[2] + '.' + m[3];
  }

  /** '2026-11-28' → '금' (요일) */
  function weekdayKo(s) {
    var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return '';
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return '일월화수목금토 '.charAt(d.getDay()).trim();
  }

  /** 연락처 글자에서 실제 전화번호만 뽑는다(휴대폰 우선). */
  function telOf(raw) {
    var s = String(raw || '');
    var m = s.match(/01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/) || s.match(/0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}/);
    return m ? m[0].replace(/[^\d]/g, '') : '';
  }

  /** '02-000-0000 / 010-0000-0000' + 줄바꿈 + 담당자명 → {dial, display, name} */
  function telInfo(raw) {
    var s = String(raw || '');
    var lines = s.split('\n');
    var name = lines.length > 1 ? lines[1].trim() : '';
    var dial = telOf(s);
    return { dial: dial, display: fmtPhone(dial), name: dial ? name : '' };
  }

  function fmtPhone(d) {
    if (d.length === 11) return d.substr(0, 3) + '-' + d.substr(3, 4) + '-' + d.substr(7);
    if (d.length === 10) return d.substr(0, 3) + '-' + d.substr(3, 3) + '-' + d.substr(6);
    return d;
  }

  /**
   * 지도 검색어 — 소재지에서 주소 부분만 뽑는다. 상호는 붙이지 않는다(주소+상호 조합은 지도 검색 오류가 잦음).
   * ① 도로명+번지(…로·길 123), ② 지번(…동 123-4) 순으로 쓰고, 괄호 안 아파트명·동·호수는 뺀다.
   * 주소가 비었거나 '미확인'이면 빈 문자열을 돌려준다.
   */
  function addrQuery(addr) {
    var src = String(addr || '').replace(/\n/g, ' ').replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
    if (!src || src.indexOf('미확인') >= 0) return '';
    var m = src.match(/[가-힣0-9]+(?:로|길)\s*\d+(?:-\d+)?/) || src.match(/[가-힣]+동\s*\d+(?:-\d+)?/);
    if (!m) return '';
    var q = m[0].replace(/\s+/g, ' ').trim();
    if (!/^대구/.test(q)) {
      if (/^(달서구|중구|남구|서구|동구|북구|수성구|달성군)/.test(q)) q = '대구 ' + q;
      else {
        var gu = src.match(/(달서구|중구|남구|서구|동구|북구|수성구|달성군)/);
        if (gu) q = '대구 ' + gu[1] + ' ' + q;
      }
    }
    return q;
  }

  /* ── 안드로이드에서 카카오맵 앱을 바로 연다 ────────────
     안드로이드는 intent:// 로 앱(net.daum.android.map)을 직접 실행하고,
     앱이 없을 때만 S.browser_fallback_url 로 카카오맵 웹주소를 연다. */
  var IS_ANDROID = /Android/i.test(navigator.userAgent || '');
  /* 아이폰·아이패드 판별 (맥 사파리의 '데스크톱 웹사이트' 모드도 포함) */
  var IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '') ||
               (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);

  /** schemePath·fallbackUrl → 안드로이드면 intent:// 링크, 아니면 웹 주소 그대로 */
  function kakaoIntent(schemePath, fallbackUrl) {
    if (!IS_ANDROID) return fallbackUrl;
    return 'intent://' + schemePath + '#Intent;scheme=kakaomap;package=net.daum.android.map;S.browser_fallback_url=' +
      encodeURIComponent(fallbackUrl) + ';end';
  }

  /* ── 티맵 길찾기 링크 ────────────────────────────────
     안드로이드는 intent:// 로 티맵(com.skt.tmap.ku)을 바로 열고, 앱이 없으면
     S.browser_fallback_url(카카오 길찾기 웹 주소)로 떨어진다. iOS는 tmap:// 스킴.
     좌표가 없으면 티맵으로 길찾기를 할 수 없으므로 fallbackUrl 로 대체한다. */
  function tmapHref(name, lat, lng, fallbackUrl) {
    var fb = fallbackUrl || '';
    if (!hasLL(lat, lng)) return fb;
    var nm = encodeURIComponent(String(name || ''));
    if (IS_ANDROID) {
      return 'intent://route?referrer=com.skt.Tmap&goalname=' + nm +
        '&goalx=' + lng + '&goaly=' + lat +
        '&reqCoordType=WGS84&resCoordType=WGS84#Intent;scheme=tmap;package=com.skt.tmap.ku;S.browser_fallback_url=' +
        encodeURIComponent(fb) + ';end';
    }
    if (IS_IOS) {
      return 'tmap://route?rGoName=' + nm + '&rGoX=' + lng + '&rGoY=' + lat;
    }
    return fb;   /* 그 밖(데스크톱)에서는 카카오 웹 길찾기로 */
  }

  /** 시트 좌표(M·N열)가 지도에 쓸 수 있는 값인지 */
  function hasLL(lat, lng) {
    return lat !== null && lat !== undefined && lng !== null && lng !== undefined &&
           lat !== '' && lng !== '' && isFinite(Number(lat)) && isFinite(Number(lng));
  }

  /** 앱 안 지도 탭(번호 핀)에 찍히는 항목인지 — 좌표가 있는 정기방문만 */
  function canMapInApp(it) {
    return !!it && it.type === 'regular' && hasLL(it.lat, it.lng);
  }

  /** 지도 링크 — 시트 좌표(M·N열)가 있으면 그 좌표에 핀을 꽂은 화면(look)으로 바로 열고,
      좌표가 없을 때만 주소로, 주소도 없으면 상호로 검색한다. */
  function mapHref(addr, name, lat, lng) {
    var webUrl;
    if (hasLL(lat, lng)) {
      webUrl = 'https://map.kakao.com/link/map/' + encodeURIComponent(String(name || addr || '')) + ',' + lat + ',' + lng;
      return kakaoIntent('look?p=' + lat + ',' + lng, webUrl);
    }
    var q = addrQuery(addr);
    if (q) {
      webUrl = 'https://map.kakao.com/link/search/' + encodeURIComponent(q);
      return kakaoIntent('search?q=' + encodeURIComponent(q), webUrl);
    }
    webUrl = 'https://map.kakao.com/link/search/' + encodeURIComponent(String(name || ''));
    return kakaoIntent('search?q=' + encodeURIComponent(String(name || '')), webUrl);
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2400);
  }

  /* ── 상태 표시줄 ──────────────────────────────────── */
  function setStatus(kind, text) {
    var el = $('save-state'), dot = $('dot');
    var cls = 'dot', msg = text || '';
    if (kind === 'busy') { cls += ' busy'; msg = text || '저장 중…'; }
    else if (kind === 'editing') { cls += ' busy'; msg = text || '입력 중…'; }
    else if (kind === 'saved') { cls += ' ok'; msg = '시트에 저장됨 · ' + (text || hhmm()); }
    else if (kind === 'failed') { cls += ' bad'; msg = text || '저장 실패 · 다시 시도'; }
    else if (kind === 'offline') { cls += ' bad'; msg = text || '시트 연결이 끊겼습니다'; }
    else if (kind === 'ready') { cls += ' ok'; msg = '시트와 연결됨' + (S.fetchedAt ? ' · ' + S.fetchedAt.substr(11, 5) : ''); }
    else { msg = text || '시트 연결 중…'; }
    dot.className = cls;
    el.textContent = msg;
  }

  /* ── 서버 호출 (Apps Script JSON API · fetch) ─────── */
  /*  아래 EXEC_URL 한 줄이 데이터 통로입니다. Apps Script를 다시 배포해도
      주소(/exec)가 같으면 이 줄은 바꿀 필요가 없습니다. */
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzj90UK9FQcWo6gFQnEKwqzf8GI6raCeo_G9uBcowiOK3YpvSKWqW25iZ5OYPA2qTKhFw/exec';
  var PASS_KEY = 'visit_check_pass';
  var PASS = '';
  try { PASS = localStorage.getItem(PASS_KEY) || ''; } catch (e) { PASS = ''; }

  function savePass(v) {
    PASS = String(v === null || v === undefined ? '' : v);
    try {
      if (PASS) localStorage.setItem(PASS_KEY, PASS);
      else localStorage.removeItem(PASS_KEY);
    } catch (e) {}
  }

  function readJSON(text) {
    try { return JSON.parse(text); } catch (e) { return null; }
  }

  /* 조회: GET  ${EXEC_URL}?api=1&action=board&pass=…   (?action=history&name=중개사명) */
  function apiGet(action, extra) {
    var url = EXEC_URL + '?api=1&action=' + encodeURIComponent(action) +
              '&pass=' + encodeURIComponent(PASS) + '&t=' + Date.now();
    if (extra) {
      Object.keys(extra).forEach(function (k) {
        var v = extra[k];
        if (v === undefined || v === null) return;
        url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(v);
      });
    }
    return fetch(url, { method: 'GET', cache: 'no-store', redirect: 'follow' })
      .then(function (r) { return r.text(); })
      .then(function (text) {
        var res = readJSON(text);
        if (!res) throw new Error('서버 응답을 읽지 못했습니다(API 배포 확인 필요)');
        return res;
      });
  }

  /* 저장: POST  Content-Type: text/plain — Apps Script CORS preflight 회피용 */
  function apiPost(payload) {
    payload.pass = PASS;
    return fetch(EXEC_URL, {
      method: 'POST',
      cache: 'no-store',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.text(); })
      .then(function (text) {
        var res = readJSON(text);
        if (!res) throw new Error('서버 응답을 읽지 못했습니다(API 배포 확인 필요)');
        return res;
      });
  }

  /* 화면 코드는 예전과 같은 srv('함수명', [인수…]) 모양을 그대로 쓴다. */
  function srv(method, args, onOk, onFail) {
    var task;
    if (method === 'getBoardData') {
      task = apiGet('board');
    } else if (method === 'getHistory') {
      task = apiGet('history', { name: args[0] });
    } else if (method === 'toggleCheck') {
      task = apiPost({ action: 'toggle', sheetType: args[0], row: args[1], checked: args[2], field: args[3] || '' });
    } else if (method === 'saveMemo') {
      task = apiPost({ action: 'memo', sheetType: args[0], row: args[1], memo: args[2] });
    } else if (method === 'saveVisitDate') {
      task = apiPost({ action: 'visitDate', sheetType: args[0], row: args[1], visitDate: args[2], slot: args[3] });
    } else {
      if (onFail) onFail(new Error('알 수 없는 호출입니다: ' + method));
      return;
    }
    task.then(function (res) {
      if (res && res.code === 'auth') {
        var e = new Error(res.error || '비밀번호가 다시 필요합니다');
        e.auth = true;
        lockOut(res.error || '비밀번호가 다시 필요합니다');
        if (onFail) onFail(e);
        return;
      }
      if (onOk) onOk(res);
    }, function (err) {
      if (onFail) onFail(err);
    });
  }

  /* ── 잠금 화면 ──────────────────────────────────── */
  function showLock(msg) {
    var lk = $('lock');
    $('boot').hidden = true;
    $('boot-retry').classList.remove('on');
    $('lock-err').textContent = msg || '';
    var inp = $('lock-pass');
    inp.value = '';
    lk.hidden = false;
    try { inp.focus(); } catch (e) {}
  }

  /* 비밀번호를 지우고 잠금 화면으로 되돌린다 (기기에는 남기지 않는다) */
  function lockOut(msg) {
    savePass('');
    S.reg = [];
    S.bal = [];
    S.byKey = {};
    S.ready = false;
    S.loading = false;
    $('list').innerHTML = '';
    $('empty').hidden = true;
    $('mapcard').hidden = true;
    document.body.classList.remove('mc-open');
    if (M.map) { try { clearOverlays(); } catch (e) {} }
    M.map = null;
    M.ready = false;
    M.failed = '';
    M.selKey = '';
    setStatus('plain', '잠김');
    showLock(msg || '');
  }

  function tryUnlock() {
    var v = $('lock-pass').value;
    if (!v) { $('lock-err').textContent = '비밀번호를 입력해 주세요'; return; }
    $('lock-err').textContent = '';
    var btn = $('lock-go');
    btn.disabled = true;
    btn.textContent = '확인 중…';
    savePass(v);
    fetchBoard(function (ok) {
      btn.disabled = false;
      btn.textContent = '들어가기';
      if (ok) $('lock').hidden = true;
    });
  }

  /* ── 잔금 이력 팝업 ────────────────────────────────
     중개사 상호를 누르면 그 중개사의 잔금 실행 이력을 최신순으로 보여 준다.
     데이터는 시트 '잔금_이력' 탭(API action=history)에서 가져오고, 한 번 받은 것은
     이 화면이 살아 있는 동안만 기억해 둔다(같은 곳을 다시 눌러도 기다리지 않게). */
  var HIST = { cache: {}, key: '', req: 0 };

  /** 만원 단위 숫자 → '163억 8,640만원' */
  function wonText(v) {
    var n = Math.round(Number(v) || 0);
    var neg = n < 0;
    n = Math.abs(n);
    var eok = Math.floor(n / 10000), man = n % 10000;
    var s = '';
    if (eok) s += eok.toLocaleString('ko-KR') + '억';
    if (man) s += (s ? ' ' : '') + man.toLocaleString('ko-KR') + '만';
    return (neg ? '-' : '') + (s || '0') + '원';
  }

  /** 만원 단위 숫자 → 거래 한 줄에 쓰는 짧은 표기 ('12,000만') */
  function manText(v) {
    var n = Number(v);
    if (!isFinite(n)) return '—';
    return Math.round(n).toLocaleString('ko-KR') + '만';
  }

  function openHistory(name) {
    var nm = String(name || '').trim();
    if (!nm) return;
    HIST.key = nm;
    $('hist-title').textContent = nm;
    $('hist-sub').textContent = '';
    $('hist-body').innerHTML = '<div class="hist-empty">불러오는 중…</div>';
    $('histwrap').hidden = false;
    document.body.classList.add('hist-open');

    var cached = HIST.cache[nm];
    if (cached) { paintHistory(cached); return; }

    var req = ++HIST.req;
    srv('getHistory', [nm], function (res) {
      if (req !== HIST.req || HIST.key !== nm) return;      /* 그 사이 다른 곳을 눌렀다 */
      if (res && res.code === 'auth') { lockOut(res.error || '비밀번호가 다시 필요합니다'); return; }
      if (!res || res.ok !== true) {
        var msg = (res && res.error) ? String(res.error) : '';
        $('hist-body').innerHTML = (!res || /알 수 없는 요청/.test(msg))
          ? '<div class="hist-empty">Code.gs 새 버전 배포 후 조회됩니다.<br>배포가 끝나면 새로고침해 주세요.</div>'
          : '<div class="hist-empty">' + esc(msg || '이력을 불러오지 못했습니다') + '</div>';
        return;
      }
      HIST.cache[nm] = res;
      paintHistory(res);
    }, function (err) {
      if (req !== HIST.req || HIST.key !== nm) return;
      $('hist-body').innerHTML = '<div class="hist-empty">이력을 불러오지 못했습니다.<br>' +
        esc((err && err.message) || '연결을 확인해 주세요') + '</div>';
    });
  }

  function paintHistory(res) {
    var items = (res && res.items) || [];
    var count = Number(res && res.count) || items.length;
    if (!count) {
      $('hist-sub').textContent = '';
      $('hist-body').innerHTML = '<div class="hist-empty">잔금 거래 이력이 없습니다.<br>' +
        '장부(2011~2026 잔금)에 이 중개사 이름으로 남은 기록이 없습니다.</div>';
      return;
    }
    var sub = ['총 <b>' + count.toLocaleString('ko-KR') + '건</b>'];
    sub.push('총 <b>' + wonText(res.totalManwon) + '</b>');
    if (res.latest) sub.push('최근 <b>' + esc(res.latest) + '</b>');
    $('hist-sub').innerHTML = sub.join(' · ');
    /* 장부에 다른 상호로 남아 있는 거래를 합쳐 보여 줄 때는 그 이름을 밝힌다 */
    var src = [];
    (res.sources || []).forEach(function (s) {
      if (s && s !== res.name && src.indexOf(s) < 0) src.push(s);
    });
    if (src.length) {
      $('hist-sub').innerHTML += '<br><span class="hist-src">장부 표기: ' + esc(src.join(' · ')) + '</span>';
    }

    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i] || {};
      var hasAmt = it.amount !== null && it.amount !== undefined && it.amount !== '';
      html += '<div class="hist-row">' +
        '<span class="hd">' + esc(it.date || '') + '</span>' +
        '<span class="hc">' + esc(it.customer || '') + '</span>' +
        '<span class="hm">' + (hasAmt ? esc(manText(it.amount)) : '—') + '</span>' +
        (it.note ? '<span class="hn">' + esc(it.note) + '</span>' : '') +
      '</div>';
    }
    $('hist-body').innerHTML = html;
    $('hist-body').scrollTop = 0;
  }

  function closeHistory() {
    $('histwrap').hidden = true;
    document.body.classList.remove('hist-open');
    HIST.key = '';
  }

  /* ── 집계 ─────────────────────────────────────────── */
  function scopeItems() {
    if (S.tab === '잔금') return S.bal;
    /* 전체 탭은 정기방문만 깔끔하게 — 잔금은 잔금 탭에서만 본다 */
    if (S.tab === '전체') return S.reg;
    return S.reg.filter(function (it) { return it.week === S.tab; });
  }

  function pctOf(done, total) { return total ? Math.round(done / total * 100) : 0; }

  /** 잔금 탭 순서 — 잔금완료가 안 된 잔금부터(잔금일 빠른 순), 완료된 잔금은 최근 순 */
  function sortBal() {
    S.bal.sort(function (a, b) {
      var da = a.checked ? 1 : 0, db = b.checked ? 1 : 0;
      if (da !== db) return da - db;
      var x = String(a.date || '9999-12-31'), y = String(b.date || '9999-12-31');
      if (x !== y) return da === 0 ? (x < y ? -1 : 1) : (x > y ? -1 : 1);
      return Number(a.row) - Number(b.row);
    });
  }

  function updateSummary() {
    var rows = scopeItems();
    var done = 0, after = 0;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].checked) done++;
      if (rows[i].type === 'balance' && rows[i].after) after++;
    }
    var pct = pctOf(done, rows.length);
    $('sum-total').textContent = rows.length;
    $('sum-done').textContent = done;
    $('sum-left').textContent = rows.length - done;
    $('sum-pct').textContent = pct + '%';
    $('sum-scope').textContent = S.tab;
    var leftCap = $('sum-left').parentNode.querySelector('span');
    if (leftCap) leftCap.textContent = (S.tab === '잔금') ? '미완료' : '미방문';
    $('bar-fill').style.width = pct + '%';

    var rd = 0, bdone = 0, bafter = 0;
    S.reg.forEach(function (it) { if (it.checked) rd++; });
    S.bal.forEach(function (it) { if (it.checked) bdone++; if (it.after) bafter++; });
    $('sum-reg').innerHTML = '정기 <b>' + S.reg.length + '곳</b> · 완료 <b>' + rd + '</b> (' + pctOf(rd, S.reg.length) + '%)';
    $('sum-ind').innerHTML = '잔금 <b>' + S.bal.length + '건</b> · 완료 <b>' + bdone + '</b> · 후방문 <b>' + bafter + '</b>';

    /* 탭 바로 아래 한 줄 — 지금 보고 있는 범위의 건수와 완료 수 */
    var sdone = 0;
    for (var k = 0; k < rows.length; k++) if (rows[k].checked) sdone++;
    var scopeName = S.tab;
    var unit = (S.tab === '잔금') ? '건' : '곳';
    var sr = $('sresult');
    sr.hidden = false;
    if (S.q) {
      sr.innerHTML = '<span>‘' + esc(S.q) + '’ 검색 <b>' + visibleItems().length + '</b>건</span><span>' + esc(scopeName) + ' 안에서</span>';
    } else if (S.tab === '잔금') {
      sr.innerHTML = '<span>잔금 <b>' + rows.length + '</b>건</span>' +
        '<span>잔금완료 <b>' + sdone + '</b> · 남음 <b>' + (rows.length - sdone) + '</b> · 후방문 <b>' + after + '</b></span>';
    } else {
      sr.innerHTML = '<span>' + esc(scopeName) + ' <b>' + rows.length + '</b>' + unit + '</span>' +
        '<span>완료 <b>' + sdone + '</b> · 미완료 <b>' + (rows.length - sdone) + '</b></span>';
    }

    /* 지도 힌트 */
    var hint = $('vhint');
    if (S.view === 'map') {
      var pinned = mappableItems().length;
      hint.textContent = (S.tab === '잔금') ? '잔금은 목록에서만 봅니다' : (pinned + '곳 번호 핀');
    } else {
      hint.textContent = '';
    }
  }

  /* ── 탭 ───────────────────────────────────────────── */
  function renderTabs() {
    var html = '';
    for (var i = 0; i < TABS.length; i++) {
      var t = TABS[i];
      html += '<button class="tab' + (S.tab === t.k ? ' on' : '') + '" type="button" data-tab="' + esc(t.k) + '">' +
        esc(t.label) + '</button>';
    }
    $('tabs').innerHTML = html;
  }

  /* ── 필터 ─────────────────────────────────────────── */
  function matchesQuery(it) {
    if (!S.q) return true;
    var hay;
    if (it.type === 'regular') {
      hay = [it.name, it.week, it.course, it.grade, it.addr, it.note, it.memo, it.tel].join(' ');
    } else {
      hay = [it.client, it.broker, it.place, it.branch, it.lawyer, it.cond, it.memo,
             it.date, it.time].filter(Boolean).join(' ');
    }
    return hay.toLowerCase().indexOf(S.q) >= 0;
  }

  function visibleItems() {
    return scopeItems().filter(matchesQuery);
  }

  /* 지도에 찍을 수 있는 항목 (좌표가 있는 정기방문만) */
  function mappableItems() {
    return scopeItems().filter(function (it) { return it.type === 'regular' && it.lat && it.lng; });
  }

  /** 전체 탭은 정기방문 통번호(1~136), 주차 탭은 그 주차 안 동선 순번 (시트 행 순서 = 방문 순서) */
  function seqOf(it) {
    if (S.tab === '전체') return S.allSeqByKey[keyOf(it)] || '';
    return S.seqByKey[keyOf(it)] || '';
  }

  function buildSeq() {
    /* 전체 탭 통번호 — 정기방문 전체 목록(S.reg, 시트 행 순서) 기준 1..N */
    S.allSeqByKey = {};
    S.reg.forEach(function (it, i) { S.allSeqByKey[keyOf(it)] = String(i + 1); });
    S.seqByKey = {};
    var weeks = {};
    S.reg.forEach(function (it) {
      var w = it.week || '';
      if (!weeks[w]) weeks[w] = [];
      weeks[w].push(it);
    });
    Object.keys(weeks).forEach(function (w) {
      weeks[w].sort(function (a, b) { return Number(a.no || 0) - Number(b.no || 0); });
      weeks[w].forEach(function (it, i) { S.seqByKey[keyOf(it)] = String(i + 1); });
    });
  }

  /* ── 카드 ─────────────────────────────────────────── */
  /** 잔금 카드 — 잔금일·시간 · 고객명 · 중개사(점선=이력 팝업) · 잔금장소 · 실행지점 · 법무사 · 금액 · 조건
      · 잔금완료(큰 체크) 바로 아래 잔금후방문(같은 크기 앰버 체크) · 결과메모 */
  function balCardHTML(it) {
    var key = keyOf(it);
    var on = !!it.checked;                     /* 큰 체크 = 잔금완료 */
    var memoVal = (it.draft !== undefined) ? it.draft : it.memo;
    var wd = weekdayKo(it.date);
    var when = it.date ? (shortDay(it.date) + (wd ? '(' + wd + ')' : '')) : '잔금일 미정';

    var broker = it.broker
      ? '<button class="nm" type="button" data-act="hist" aria-label="' + esc(it.broker) + ' 잔금 이력 보기">' + esc(it.broker) + '</button>'
      : '<span class="none">(중개사 미입력)</span>';

    var amtTxt = (it.amount !== null && it.amount !== undefined && it.amount !== '')
      ? manText(it.amount) : '—';
    var bl = '';
    if (it.place) bl += '<b>잔금장소</b><i>' + esc(it.place) + '</i>';
    if (it.branch) bl += '<b>실행지점</b><i>' + esc(it.branch) + '</i>';
    if (it.lawyer) bl += '<b>법무사</b><i>' + esc(it.lawyer) + '</i>';
    bl += '<b>금액</b><i class="amt">' + esc(amtTxt) + '</i>';

    return '<article class="card bal' + (on ? ' done' : '') + '" data-key="' + key +
        '" data-type="balance" data-row="' + it.row + '">' +
      '<div class="card-top">' +
        '<div class="chkcol">' +
          '<button class="check" type="button" data-act="toggle" role="checkbox" aria-checked="' + on +
            '" aria-label="' + esc((it.client || '') + ' 잔금완료') + '">' +
            '<svg viewBox="0 0 24 24"><path d="M4.5 12.6l5 5L19.5 7.2"/></svg></button>' +
          '<span class="chkcap">잔금완료</span>' +
          '<button class="bchk' + (it.after ? ' on' : '') + '" type="button" data-act="after"' +
            ' aria-pressed="' + (!!it.after) + '" aria-label="' + esc((it.client || '') + ' 잔금후방문 완료') + '">' +
            '<svg viewBox="0 0 24 24"><path d="M4.5 12.6l5 5L19.5 7.2"/></svg></button>' +
          '<span class="chkcap aft' + (it.after ? ' on' : '') + '">잔금 후 방문</span>' +
        '</div>' +
        '<div class="info">' +
          '<h2 class="name"><span class="when">' + esc(when) + '</span>' +
            (it.time ? '<span class="when t">' + esc(it.time) + '</span>' : '') +
            '<em class="cust">' + esc(it.client || '(고객명 미입력)') + '</em></h2>' +
          '<p class="broker">' + broker + '</p>' +
          '<div class="blines">' + bl + '</div>' +
          (it.cond ? '<p class="cond">' + esc(it.cond) + '</p>' : '') +
        '</div>' +
      '</div>' +
      '<input class="memo" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" placeholder="결과·메모 (자동 저장)"' +
        ' aria-label="' + esc((it.client || '') + ' 잔금 메모') + '" value="' + esc(memoVal) + '">' +
    '</article>';
  }

  function cardHTML(it) {
    if (it.type === 'balance') return balCardHTML(it);
    var key = keyOf(it);
    var on = !!it.checked;
    var memoVal = (it.draft !== undefined) ? it.draft : it.memo;
    var head, metas = [], tel, mapLabel, mapURL, memoPh;

    if (it.type === 'regular') {
      var seq = seqOf(it);
      head = (seq ? '<span class="seq">' + esc(seq) + '</span>' : '') +
        '<button class="nm" type="button" data-act="hist" aria-label="' + esc(it.name) + ' 잔금 이력 보기">' +
          esc(it.name) + '</button>' +
        (it.grade ? '<span class="chip">' + esc(it.grade) + '</span>' : '');
      var line1 = [it.week, it.course].filter(Boolean).join(' · ');
      if (line1) metas.push('<span class="wk">' + esc(line1) + '</span>');
      if (it.addr && it.addr.indexOf('미확인') < 0) metas.push('<span>' + esc(it.addr) + '</span>');
      var info = telInfo(it.tel);
      if (info.display) {
        metas.push('<span class="tel-no">' + esc(info.display) + (info.name ? ' · ' + esc(info.name) : '') + '</span>');
      }
      if (it.note) metas.push('<span class="note">' + esc(it.note) + '</span>');
      tel = info.dial;
      mapURL = mapHref(it.addr, it.name, it.lat, it.lng);
      mapLabel = '지도';
      memoPh = '상담·방문 메모 (자동 저장)';
    }

    var telBtn = tel
      ? '<a class="btn tel" href="tel:' + tel + '" aria-label="' + esc(it.name || it.client) + ' 전화 걸기">' + ICON_PHONE + '전화</a>'
      : (it.type === 'regular'
          ? '<span class="btn tel off">' + ICON_PHONE + '번호 미확인</span>'
          : '');

    var vdate = (it.type === 'regular')
      ? '<div class="vdslot">' + vdateHTML(it) + '</div>' : '';

    /* 좌표가 있는 정기방문이면 [지도]는 외부 카카오맵 앱으로 나가지 않고
       앱 안 지도 탭의 그 핀으로 넘어간다(data-act="inappmap").
       좌표가 없는 곳은 지금처럼 카카오맵 링크로 연다. */
    var inApp = canMapInApp(it);

    return '<article class="card' + (on ? ' done' : '') + '" data-key="' + key + '" data-type="' + it.type +
      '" data-row="' + it.row + '">' +
      '<div class="card-top" data-act="toggle">' +
        '<button class="check" type="button" role="checkbox" aria-checked="' + on + '" aria-label="' +
          esc((it.name || it.client || '') + ' 완료 체크') + '">' +
          '<svg viewBox="0 0 24 24"><path d="M4.5 12.6l5 5L19.5 7.2"/></svg></button>' +
        '<div class="info">' +
          '<h2 class="name">' + head + '</h2>' +
          '<p class="meta">' + metas.join('') + '</p>' +
          vdate +
        '</div>' +
      '</div>' +
      '<div class="acts">' + telBtn +
        '<a class="btn map" href="' + mapURL + '"' +
          (IS_ANDROID ? '' : ' target="_blank"') +
          (inApp ? ' data-act="inappmap"' : '') +
          ' rel="noopener" aria-label="' + esc(it.name || it.client) + ' 지도 보기">' + ICON_PIN + mapLabel + '</a>' +
      '</div>' +
      '<input class="memo" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" placeholder="' + memoPh +
        '" aria-label="' + esc((it.name || it.client || '') + ' 메모') + '" value="' + esc(memoVal) + '">' +
    '</article>';
  }

  /* ── 렌더 ─────────────────────────────────────────── */
  function render() {
    renderTabs();
    $('list').hidden = (S.view === 'map');
    $('mapview').hidden = (S.view !== 'map');
    $('searchrow').hidden = (S.view === 'map');
    if (S.view === 'map') $('sresult').hidden = true;
    /* 지도 탭을 벗어나면 위치 추적을 멈춰 배터리를 줄인다 */
    if (S.view !== 'map' || S.tab === '잔금') stopMyLoc();

    if (S.view === 'list') {
      var rows = visibleItems();
      var html = rows.map(cardHTML).join('');
      $('list').innerHTML = html;

      var emptyEl = $('empty');
      if (rows.length) {
        emptyEl.hidden = true;
      } else {
        emptyEl.hidden = false;
        if (S.q) emptyEl.textContent = '‘' + S.q + '’ 검색 결과가 없습니다';
        else if (S.tab === '잔금') {
          emptyEl.textContent = S.balMissing
            ? 'Apps Script 새 버전을 배포하면 잔금 일정이 여기에 나옵니다.\n(배포 전이라도 정기방문 체크는 그대로 동작합니다)'
            : '잔금 일정이 없습니다.\n캘린더에 잔금 일정이 잡히면 매일 08:30 자동으로 들어옵니다.';
          emptyEl.style.whiteSpace = 'pre-line';
        } else {
          emptyEl.textContent = '표시할 항목이 없습니다';
        }
      }
    } else {
      $('empty').hidden = true;
      renderMap();
    }

    updateSummary();
  }

  /* 목록에서 특정 중개사 카드를 화면 가운데로 — 지도에서 보던 곳에서 목록으로 돌아올 때 쓴다.
     해당 카드가 없으면(다른 탭·검색으로 빠진 항목) false 를 돌려준다. */
  function scrollListToKey(key) {
    if (!key) return false;
    var cards = $('list').querySelectorAll('.card'), el = null;
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].dataset.key === key) { el = cards[i]; break; }
    }
    if (!el) return false;
    try { el.scrollIntoView({ block: 'center', behavior: 'instant' }); }
    catch (e) { el.scrollIntoView({ block: 'center' }); }
    return true;
  }

  /* ── 카카오맵 ─────────────────────────────────────── */
  function loadKakao(cb) {
    if (window.kakao && window.kakao.maps) { cb(''); return; }
    if (!KAKAO_JS_KEY || KAKAO_JS_KEY.indexOf('YOUR_') === 0) { cb('nokey'); return; }
    var s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(KAKAO_JS_KEY) +
            '&autoload=false&libraries=services';
    s.onload = function () {
      if (!window.kakao || !window.kakao.maps) { cb('sdk'); return; }
      try {
        window.kakao.maps.load(function () { cb(''); });
      } catch (e) { cb('sdk'); }
    };
    s.onerror = function () { cb('sdk'); };
    document.head.appendChild(s);
  }

  function mapNote(msg) {
    var n = $('mapnote');
    if (!msg) { n.innerHTML = '<b>핀 번호가 방문 순서</b>입니다. 핀을 누르면 아래 카드에서 전화·완료 체크·티맵·카카오 길찾기를 할 수 있습니다. 오른쪽 아래 <b>내 위치</b> 버튼을 누르면 현재 위치로 이동합니다.'; return; }
    if (msg === 'nokey') {
      n.innerHTML = '지도 키가 아직 없습니다. <b>index.html</b> 맨 위 <b>KAKAO_JS_KEY</b> 한 곳에 카카오 JavaScript 키를 넣고 다시 배포하면 지도가 뜹니다. (지금도 목록·체크·메모는 정상 동작합니다)';
    } else if (msg === 'sdk') {
      var org = location.origin || '';
      n.innerHTML = '카카오맵을 불러오지 못했습니다. 카카오 <b>[플랫폼 키 → JavaScript SDK 도메인]</b>에 아래 주소를 추가하고 저장해 주세요:<br><code style="display:inline-block;margin:5px 6px 0 0;padding:4px 7px;background:#fff;border:1px solid #CDE0D9;border-radius:6px;font-size:10px;word-break:break-all">' + esc(org) + '</code><button type="button" onclick="navigator.clipboard&&navigator.clipboard.writeText(\'' + esc(org) + '\');this.textContent=\'복사됨!\'" style="padding:4px 9px;border:0;border-radius:6px;background:#004E41;color:#fff;font-size:10px;font-weight:700;cursor:pointer">주소 복사</button>';
    } else if (msg === 'none') {
      n.innerHTML = '이 범위에는 지도에 표시할 좌표가 없습니다. <b>위치</b>가 비어 있는 곳은 시트 M·N열(위도·경도)을 채우면 핀이 생깁니다.';
    } else {
      n.innerHTML = esc(msg);
    }
  }

  function clearOverlays() {
    for (var i = 0; i < M.overlays.length; i++) {
      try { M.overlays[i].setMap(null); } catch (e) {}
    }
    M.overlays = [];
  }

  /* ── 내 위치(geolocation) ─────────────────────────── */
  var MYLOC_OPTS = { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 };

  function myLocSupported() {
    return !!(navigator.geolocation && navigator.geolocation.watchPosition);
  }

  function setMyLocBtn(kind, label) {
    var b = $('myloc'), t = $('myloc-txt');
    if (!b) return;
    if (!myLocSupported()) { b.className = 'mylocbtn off'; return; }
    b.className = 'mylocbtn' + (kind ? ' ' + kind : '');
    if (t) t.textContent = label || '내 위치';
  }

  /* 지도 위 파란 점(펄스) 그리기·이동 */
  function drawMyLoc(lat, lng) {
    var kakao = window.kakao;
    if (!kakao || !M.map) return;
    M.myPos = { lat: lat, lng: lng };
    var pos = new kakao.maps.LatLng(lat, lng);
    if (!M.myOverlay) {
      var el = document.createElement('div');
      el.className = 'meloc';
      el.setAttribute('aria-hidden', 'true');
      el.innerHTML = '<i></i><b></b>';
      M.myOverlay = new kakao.maps.CustomOverlay({
        position: pos, content: el, xAnchor: 0.5, yAnchor: 0.5, clickable: false, zIndex: 2
      });
    } else {
      M.myOverlay.setPosition(pos);
    }
    M.myOverlay.setMap(M.map);
    if (M.wantPan) {
      M.wantPan = false;
      M.map.panTo(pos);
      if (M.map.getLevel() > 4) M.map.setLevel(4);
      setMyLocBtn();
    }
  }

  function stopMyLoc() {
    if (M.watchId !== null && navigator.geolocation) {
      try { navigator.geolocation.clearWatch(M.watchId); } catch (e) {}
    }
    M.watchId = null;
    M.wantPan = false;
    setMyLocBtn();
  }

  function startMyLoc() {
    if (!myLocSupported()) { setMyLocBtn(); return; }
    if (M.watchId !== null) {
      if (M.myOverlay && M.map) M.myOverlay.setMap(M.map);
      return;
    }
    if (!M.map) return;
    /* 권한이 거부된 상태면 화면을 다시 그릴 때마다 재요청하지 않는다(버튼을 누르면 재시도) */
    if (M.myDenied && !M.wantPan) { setMyLocBtn(); return; }
    try {
      M.watchId = navigator.geolocation.watchPosition(function (res) {
        var c = (res && res.coords) || {};
        if (typeof c.latitude !== 'number' || typeof c.longitude !== 'number') return;
        M.myDenied = false;
        drawMyLoc(c.latitude, c.longitude);
      }, function (err) {
        var code = (err && err.code) || 0;
        if (code === 1) {            /* 권한 거부 */
          M.myDenied = true;
          stopMyLoc();
          toast('위치 권한이 꺼져 있습니다. 브라우저 주소창의 자물쇠에서 위치를 허용해 주세요.');
        } else if (M.wantPan) {      /* 위치 확인 실패·시간 초과 */
          M.wantPan = false;
          setMyLocBtn();
          toast('현재 위치를 아직 찾지 못했습니다. 잠시 후 다시 눌러 주세요.');
        }
      }, MYLOC_OPTS);
    } catch (e) {
      setMyLocBtn();
    }
  }

  /* '내 위치' 버튼: 현재 위치로 이동(권한이 없으면 이때 요청) */
  function onMyLocClick() {
    if (!myLocSupported()) { toast('이 브라우저에서는 위치를 사용할 수 없습니다.'); return; }
    if (!M.ready) {
      M.wantPan = true;
      setMyLocBtn('wait', '지도 준비 중');
      if (M.failed) { M.wantPan = false; setMyLocBtn(); toast('지도를 불러오지 못해 위치를 표시할 수 없습니다.'); return; }
      initMap();
      return;
    }
    if (M.myPos) {
      var kakao = window.kakao;
      if (kakao) {
        M.map.panTo(new kakao.maps.LatLng(M.myPos.lat, M.myPos.lng));
        if (M.map.getLevel() > 4) M.map.setLevel(4);
      }
      var retry = M.myDenied;
      M.myDenied = false;
      if (retry) { M.wantPan = true; setMyLocBtn('wait', '권한 확인 중'); }
      else setMyLocBtn();
      startMyLoc();
      return;
    }
    M.wantPan = true;
    setMyLocBtn('wait', '위치 확인 중');
    startMyLoc();
  }

  /* 지도 탭이 화면에 떠 있는지 */
  function mapVisible() {
    var v = $('mapview');
    return !!(v && !v.hidden);
  }

  /* 컨테이너 크기를 다시 잡고(relayout) 중심·배율을 즉시 맞춘다.
     panTo는 애니메이션이라 relayout 에 취소되므로 쓰지 않는다. */
  function fitMapTo(pos, maxLevel) {
    if (!M.ready || !M.map) return;
    try { M.map.relayout(); } catch (e) {}
    try {
      var cap = (typeof maxLevel === 'number') ? maxLevel : 4;
      if (pos) M.map.setCenter(pos);
      M.map.setLevel(Math.min(M.map.getLevel(), cap));
    } catch (e) {}
  }

  /* ── 하단 카드가 열린 동안 지도가 카드에 가리지 않게 높이를 맞춘다 ──
     카드는 position:fixed 라 뷰포트 기준 위 끝(cardTop)이 스크롤과 상관없이 일정하고,
     지도는 문서 기준 위치(mapDocY)에서 시작한다. 스크롤 0 에서 지도 아래 끝이
     카드 위 끝에서 MC_GAP 만큼 위에 오도록 높이를 계산해 인라인으로 넣는다.
     (카드 높이가 이름 줄바꿈 등으로 달라져도 실측하므로 항상 맞는다.) */
  var MC_GAP = 6;
  function fitMapBox() {
    var mp = $('map'), card = $('mapcard');
    if (!mp) return;
    mp.style.height = '';                       /* 먼저 CSS 기본 높이로 되돌려 놓고 잰다 */
    if (!card || card.hidden || !mapVisible()) return;
    var cardTop = card.getBoundingClientRect().top;
    var mapDocY = mp.getBoundingClientRect().top + (window.pageYOffset || 0);
    if (!cardTop || cardTop < 120) return;      /* 아직 레이아웃 전이면 건너뜀 */
    var h = Math.round(cardTop - mapDocY - MC_GAP);
    if (h < 200) h = 200;                       /* 너무 작아지면 지도 대신 목록을 보게 된다 */
    mp.style.height = h + 'px';
  }

  /* 높이를 바꾼 뒤 지도 컨테이너를 다시 재고(relayout) 선택 핀을 정중앙에 둔다.
     배율은 건드리지 않는다 — 지도에서 핀을 눌러 볼 때 보던 화면(배율)을 유지한다. */
  function syncMapBox(pos) {
    fitMapBox();
    if (!M.ready || !M.map) return;
    try { M.map.relayout(); } catch (e) {}
    if (pos) { try { M.map.setCenter(pos); } catch (e) {} }
  }

  function renderMap() {
    $('mapcard').hidden = !M.selKey;
    if (!M.selKey) document.body.classList.remove('mc-open');
    fitMapBox();          /* 카드가 열려 있으면 지도를 카드 위까지로 줄인다 */
    var items = mappableItems();
    if (S.tab === '잔금') {
      mapNote('잔금 일정은 지도 좌표가 없습니다. 잔금 탭의 목록에서 보세요.');
      clearOverlays();
      return;
    }
    if (!M.ready) {
      if (M.failed) { mapNote(M.failed); return; }
      if (!M.loading) initMap();
      return;
    }
    mapNote('');
    var kakao = window.kakao;
    var map = M.map;
    /* 목록에서 지도로 막 바뀌면 지도가 숨어 있던 동안 컨테이너 크기를 잃는다.
       크기를 다시 잡지 않으면 타일이 왼쪽 위 1/4만 그려지므로 먼저 relayout 한다. */
    if (mapVisible()) { try { map.relayout(); } catch (e) {} }
    clearOverlays();
    startMyLoc();   /* 지도 탭이 열려 있는 동안 내 위치 실시간 추적 */
    var bounds = new kakao.maps.LatLngBounds();
    var selOverlay = null;

    var seen = {};
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var ck = Number(it.lat).toFixed(5) + ',' + Number(it.lng).toFixed(5);
      var idx = seen[ck] || 0;
      seen[ck] = idx + 1;
      var lat = Number(it.lat), lng = Number(it.lng);
      if (idx > 0) {
        var ang = (idx - 1) * (Math.PI * 2 / 6);
        var r = 0.00018 * (1 + Math.floor((idx - 1) / 6));
        lat += Math.sin(ang) * r;
        lng += Math.cos(ang) * r * 1.2;
      }
      var pos = new kakao.maps.LatLng(lat, lng);
      bounds.extend(pos);
      var seq = seqOf(it);
      var el = document.createElement('div');
      el.className = 'pin' + (it.checked ? ' done' : '') + (keyOf(it) === M.selKey ? ' sel' : '');
      el.innerHTML = '<span>' + esc(seq || '·') + '</span>';
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', seq + '번 ' + it.name);
      el.attachEvent ? el.attachEvent('onclick', mkClick(it)) : el.addEventListener('click', mkClick(it));
      var ov = new kakao.maps.CustomOverlay({
        position: pos,
        content: el,
        xAnchor: 0.5,
        yAnchor: 1,
        clickable: true,
        zIndex: 3
      });
      ov.setMap(map);
      M.overlays.push(ov);
      if (keyOf(it) === M.selKey) selOverlay = ov;
    }

    if (!items.length) { mapNote('none'); return; }
    if (M.selKey && selOverlay) {
      var sel = S.byKey[M.selKey];
      if (sel) {
        /* panTo(애니메이션)는 relayout 에 취소되므로 setCenter 로 즉시 중심을 잡는다 */
        fitMapTo(new kakao.maps.LatLng(Number(sel.lat), Number(sel.lng)), 4);
        showMapCard(sel);   /* 목록에서 [지도]로 처음 들어온 경우에도 하단 카드가 바로 뜨게 */
      }
    } else if (items.length === 1) {
      map.setCenter(bounds.getSouthWest ? new kakao.maps.LatLng(items[0].lat, items[0].lng) : null);
      map.setLevel(4);
    } else {
      map.setBounds(bounds, 24, 24, 24, 24);
    }
  }

  function mkClick(it) {
    return function (ev) {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      selectItem(it);
    };
  }

  function selectItem(it) {
    M.selKey = keyOf(it);
    showMapCard(it);
    /* 핀 색만 갱신 (지도 재생성 없이) */
    var cards = document.querySelectorAll('#map .pin');
    if (cards && M.overlays.length) {
      renderMapPinsOnly();
    }
  }

  function renderMapPinsOnly() {
    var items = mappableItems();
    var kakao = window.kakao;
    if (!kakao) return;
    for (var i = 0; i < M.overlays.length && i < items.length; i++) {
      var it = items[i];
      var el = M.overlays[i].getContent();
      if (!el) continue;
      var cls = 'pin' + (it.checked ? ' done' : '') + (keyOf(it) === M.selKey ? ' sel' : '');
      if (el.className !== cls) el.className = cls;
    }
  }

  /* 목록 카드의 [지도] — 외부 카카오맵 앱 대신 앱 안 지도 탭으로 넘어가
     그 중개사 핀으로 확대·이동하고 하단 카드를 연다. */
  function openInAppMap(it) {
    if (!canMapInApp(it)) return;
    flushAll();                 /* 대기 중인 메모를 먼저 저장 */
    M.selKey = keyOf(it);
    S.view = 'map';
    Array.prototype.forEach.call(document.querySelectorAll('#viewtog .vt'), function (x) {
      x.classList.toggle('on', x.dataset.view === 'map');
    });
    render();                   /* #mapview 표시 → renderMap → 필요하면 initMap */
    showMapCard(it);
    focusMapPin(it);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* 지도가 아직 없으면(첫 진입) initMap 이 중심을 잡고, 이미 떠 있으면 그 핀으로 옮긴다.
     목록에서 넘어온 직후에는 브라우저가 컨테이너 크기를 확정하기 전이라, 한 프레임·
     120ms·350ms 에서 relayout + setCenter 를 한 번씩 보정해 어떤 단말·타이밍에서도
     타일이 꽉 차게 그려지고 핀이 정중앙에 오게 한다. */
  function focusMapPin(it) {
    if (!window.kakao || !M.ready || !M.map) return;
    var kakao = window.kakao;
    var pos = new kakao.maps.LatLng(Number(it.lat), Number(it.lng));
    var key = keyOf(it);
    var settle = function () {
      if (!M.map || M.selKey !== key || !mapVisible()) return;
      fitMapTo(pos, 4);
    };
    if (window.requestAnimationFrame) window.requestAnimationFrame(settle);
    else setTimeout(settle, 0);
    setTimeout(settle, 120);
    setTimeout(settle, 350);
  }

  function showMapCard(it) {
    var card = $('mapcard');
    card.hidden = false;
    document.body.classList.add('mc-open');
    $('mc-no').textContent = seqOf(it) || it.no || '';
    $('mc-name').textContent = it.name || '';
    $('mc-name').setAttribute('aria-label', (it.name || '') + ' 잔금 이력 보기');
    var sub = [];
    if (it.course) sub.push(it.course);
    if (it.addr && it.addr.indexOf('미확인') < 0) sub.push(it.addr);
    else if (it.addr) sub.push('소재지 미확인');
    $('mc-sub').textContent = sub.join(' · ');
    /* 방문일 알약도 같이 — 지도에서 완료 체크한 뒤에도 이 자리에서 날짜를 고칠 수 있게 */
    paintDateSlot($('mapcard').querySelector('.vdslot'), it);

    var info = telInfo(it.tel);
    var telA = $('mc-tel');
    if (info.dial) {
      telA.href = 'tel:' + info.dial;
      telA.className = 'btn tel';
      telA.innerHTML = ICON_PHONE + '전화';
      telA.style.display = '';
    } else {
      telA.href = '#';
      telA.className = 'btn tel off';
      telA.textContent = '번호없음';
      telA.style.display = '';
    }

    var doneBtn = $('mc-done');
    doneBtn.textContent = it.checked ? '완료 ✓' : '완료';
    doneBtn.className = 'btn done' + (it.checked ? ' on' : '');
    doneBtn.disabled = false;

    /* 길찾기 — 티맵과 카카오맵을 나란히 둔다.
       좌표가 있으면 각 앱의 자동차 길찾기로 바로 열고, 좌표가 없으면 카카오 검색으로 대체한다. */
    var hasCoord = hasLL(it.lat, it.lng);
    var webRoute = hasCoord
      ? 'https://map.kakao.com/link/to/' + encodeURIComponent(it.name) + ',' + it.lat + ',' + it.lng
      : 'https://map.kakao.com/link/search/' + encodeURIComponent(addrQuery(it.addr) || String(it.name || ''));
    var kakaoA = $('mc-route');
    var tmapA = $('mc-tmap');
    kakaoA.innerHTML = ICON_KAKAO + '카카오';
    tmapA.innerHTML = ICON_TMAP + '티맵';
    kakaoA.href = hasCoord ? kakaoIntent('route?ep=' + it.lat + ',' + it.lng + '&by=car', webRoute)
                           : mapHref(it.addr, it.name);
    tmapA.href = tmapHref(it.name, it.lat, it.lng, webRoute);
    /* intent:// · tmap:// 링크에 target=_blank 가 있으면 빈 새 탭이 열리므로 앱 스킴일 때는 뺀다 */
    var kakaoBlank = !IS_ANDROID;              /* iOS·데스크톱은 카카오 웹 주소 */
    var tmapBlank = !(IS_ANDROID || IS_IOS);   /* iOS 는 tmap:// 스킴 */
    if (kakaoBlank) kakaoA.setAttribute('target', '_blank'); else kakaoA.removeAttribute('target');
    if (tmapBlank) tmapA.setAttribute('target', '_blank'); else tmapA.removeAttribute('target');

    /* 카드가 뜬 만큼 지도를 줄이고, 줄어든 크기로 다시 그려 선택 핀을 정중앙에 둔다 */
    var selPos = (window.kakao && hasLL(it.lat, it.lng))
      ? new window.kakao.maps.LatLng(Number(it.lat), Number(it.lng)) : null;
    syncMapBox(selPos);
    setTimeout(function () {
      if (M.selKey && !$('mapcard').hidden) syncMapBox(selPos);
    }, 90);   /* 폰트·줄바꿈으로 카드 높이가 확정된 뒤 한 번 더 맞춤 */
  }

  function initMap() {
    if (M.ready || M.loading) return;
    M.loading = true;
    mapNote('');
    loadKakao(function (err) {
      if (err) { M.loading = false; M.failed = err; mapNote(err); return; }
      /* 목록→지도로 막 바뀐 직후에는 브라우저가 레이아웃을 다시 계산하기 전이라
         컨테이너 크기를 잘못 읽어 지도가 1/4만 그려진다. 레이아웃이 확정된
         두 프레임 뒤에 지도를 만든다. */
      var build = function () {
        M.loading = false;
        if (M.ready) return;
        /* 만드는 사이에 목록으로 빠졌으면 숨은 채(크기 0) 만들지 않고 다음 진입 때 만든다 */
        if (S.view !== 'map' || !mapVisible()) return;
        var kakao = window.kakao;
        if (!kakao || !kakao.maps) { M.failed = 'sdk'; mapNote('sdk'); return; }
        var items = mappableItems();
        /* 목록에서 [지도]를 눌러 들어온 경우에는 처음부터 그 중개사 자리에서 지도를 연다. */
        var sel = M.selKey ? S.byKey[M.selKey] : null;
        var center = new kakao.maps.LatLng(35.8485, 128.5385);   // 죽전네거리 기준
        if (M.center) center = M.center;
        else if (sel && hasLL(sel.lat, sel.lng)) center = new kakao.maps.LatLng(Number(sel.lat), Number(sel.lng));
        else if (items.length) center = new kakao.maps.LatLng(items[0].lat, items[0].lng);
        M.map = new kakao.maps.Map($('map'), { center: center, level: sel ? 4 : 7 });
        M.map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
        M.ready = true;
        M.failed = '';
        renderMap();
        var shot = M.selKey ? S.byKey[M.selKey] : null;
        if (shot) setTimeout(function () { focusMapPin(shot); }, 60);
      };
      if (window.requestAnimationFrame) {
        window.requestAnimationFrame(function () { window.requestAnimationFrame(build); });
      } else {
        setTimeout(build, 30);
      }
    });
  }

  /* ── 체크 ─────────────────────────────────────────── */
  var inFlight = {};

  function applyCard(card, it) {
    card.classList.toggle('done', !!it.checked);
    var btn = card.querySelector('.check');
    if (btn) btn.setAttribute('aria-checked', String(!!it.checked));
    /* 잔금후방문 — 잔금완료와 따로 도는 별도 체크 */
    var aft = card.querySelector('.bchk');
    if (aft) {
      aft.classList.toggle('on', !!it.after);
      aft.setAttribute('aria-pressed', String(!!it.after));
    }
    var aftcap = card.querySelector('.chkcap.aft');
    if (aftcap) aftcap.classList.toggle('on', !!it.after);
    if (it.type === 'regular') {
      /* 방문일 알약은 render 할 때와 같은 규칙으로 다시 그린다(날짜가 비면 알약도 사라짐) */
      paintDateSlot(card.querySelector('.vdslot'), it);
    }
  }

  /* ── 방문일 수기 수정 ─────────────────────────────── */
  /* 실수로 체크를 풀었다가 다시 체크하면 시트 K열 방문일이 '오늘'로 새로 찍힌다.
     그때 카드의 방문일 알약을 누르면 그 자리에서 날짜를 골라 바로 고쳐 쓸 수 있다.
     (정기방문만 — 잔금 일정의 잔금일은 일정 날짜라 바꾸지 않는다) */

  /** 방문일 자리 — 1차·2차·3차를 한 줄 알약으로, 끝에 새 방문일 추가(+) */
  function vdateHTML(it) {
    if (!it || it.type !== 'regular') return '';
    var all = [normVisitDate(it.date), normVisitDate(it.date2), normVisitDate(it.date3)];
    var html = '';
    for (var i = 0; i < 3; i++) {
      var v = String(all[i] || '');
      if (!v) continue;
      var n = i + 1;
      html += '<button type="button" class="vdate" data-act="edit-date" data-slot="' + n + '"' +
        ' title="' + (n + '차 방문일 ' + esc(v) + ' · 눌러서 수정·삭제') + '"' +
        ' aria-label="' + esc((it.name || '') + ' ' + n + '차 방문일 ' + v + ' 수정') + '">' +
        n + '차 ' + esc(shortDay(v)) + '</button>';
    }
    /* 완료된 곳이거나 남아 있는 방문일이 있으면 새 방문일을 바로 넣을 수 있게 + 를 붙인다 */
    if (it.checked || html) {
      html += '<button type="button" class="vdate add" data-act="add-date" title="방문일 추가(오늘)"' +
        ' aria-label="' + esc((it.name || '') + ' 방문일 추가') + '">+</button>';
    }
    return html ? '<div class="vdate-row">' + html + '</div>' : '';
  }

  /** 오늘 날짜 'YYYY-MM-DD' (기기 시간대 기준) */
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  /** 그 회차의 날짜 — slot 1·2·3, 'push'면 새로 넣을 기본값(오늘) */
  function dateOfSlot(it, slot) {
    if (!it) return '';
    if (String(slot) === 'push') return todayStr();
    return normVisitDate([it.date, it.date2, it.date3][Number(slot) - 1]);
  }

  /** 날짜 입력칸 + 저장·삭제·취소 (삭제는 이미 날짜가 있는 회차에만) */
  function vdateEditHTML(it, slot) {
    var val = dateOfSlot(it, slot);
    var isPush = String(slot) === 'push';
    var del = (!isPush && val)
      ? '<button type="button" class="vbtn del" data-act="date-del">삭제</button>' : '';
    var who = isPush ? '추가할 방문일' : (slot + '차 방문일');
    return '<div class="vdedit" data-act="date-editor" data-slot="' + slot + '">' +
      '<input class="vdate-inp" type="date" value="' + esc(val) + '" ' +
        'aria-label="' + esc(who) + '" min="2010-01-01" max="2099-12-31">' +
      '<button type="button" class="vbtn save" data-act="date-save">저장</button>' +
      del +
      '<button type="button" class="vbtn cancel" data-act="date-cancel">취소</button>' +
    '</div>';
  }

  /** 알약·입력칸이 속한 항목 — 목록 카드(.card) 또는 지도 하단 카드(#mapcard) */
  function dateItemOf(slot) {
    if (!slot) return null;
    var card = slot.closest ? slot.closest('.card') : null;
    if (card && card.dataset && card.dataset.key) return S.byKey[card.dataset.key] || null;
    if (M.selKey) return S.byKey[M.selKey] || null;
    return null;
  }

  function paintDateSlot(slot, it) {
    if (!slot) return;
    slot.innerHTML = vdateHTML(it);
  }

  function openDateEditor(slotEl, slot) {
    if (!slotEl) return;
    var it = dateItemOf(slotEl);
    if (!it || it.type !== 'regular') return;
    var open = slotEl.querySelector('.vdedit');
    if (open && open.dataset.slot === String(slot)) {
      var focus = slotEl.querySelector('.vdate-inp');
      if (focus) { try { focus.focus(); } catch (e) {} }
      return;                                  /* 이미 열려 있으면 그 칸으로 커서만 */
    }
    slotEl.innerHTML = vdateEditHTML(it, slot);
    var inp = slotEl.querySelector('.vdate-inp');
    if (!inp) return;
    try { inp.focus({ preventScroll: true }); } catch (e) { try { inp.focus(); } catch (e2) {} }
    /* 방금 누른 흐름 안이라 안드로이드 크롬·삼성 인터넷은 날짜 선택기를 바로 띄울 수 있다.
       지원하지 않거나 막히면 조용히 넘기고, 칸을 다시 누르면 선택기가 뜬다. */
    if (inp.showPicker) { try { inp.showPicker(); } catch (e) {} }
  }

  function cancelDateEditor(slotEl) {
    var it = dateItemOf(slotEl);
    if (!it) return;
    paintDateSlot(slotEl, it);                 /* 저장하던 값은 버리고 원래 알약으로 */
  }

  /** 서버가 돌려준 1·2·3차를 항목에 반영 (응답에 있는 값만) */
  function applyDates(it, res) {
    if (!res || res.ok !== true) return;
    if ('visitDate' in res) it.date = normVisitDate(res.visitDate);
    if ('visitDate2' in res) it.date2 = normVisitDate(res.visitDate2);
    if ('visitDate3' in res) it.date3 = normVisitDate(res.visitDate3);
  }

  /** 화면만 먼저 — 오늘 날짜만 걷어 내고 과거 날짜는 그대로 둔다(체크 해제·서버와 같은 규칙) */
  function dropTodayLocal(it) {
    var t = todayStr();
    var arr = [normVisitDate(it.date), normVisitDate(it.date2), normVisitDate(it.date3)]
      .filter(function (v) { return !!v && v !== t; });
    it.date = arr[0] || ''; it.date2 = arr[1] || ''; it.date3 = arr[2] || '';
  }

  /** 화면만 먼저 — 새 날짜를 맨 뒤에 넣고 3개가 넘으면 가장 오래된 1차를 민다 */
  function pushLocalDate(it, val) {
    var arr = [it.date, it.date2, it.date3].filter(function (v) { return !!v; });
    if (!(arr.length && arr[arr.length - 1] === val)) {
      if (arr.length < 3) arr.push(val);
      else arr = arr.slice(1).concat([val]);
    }
    it.date = arr[0] || ''; it.date2 = arr[1] || ''; it.date3 = arr[2] || '';
  }

  /** 화면만 먼저 — 그 회차(1·2·3)만 바꾸거나(값) 지운다(빈 문자열). 빈 자리는 당겨서 정리 */
  function setSlotDate(it, n, val) {
    var arr = [it.date, it.date2, it.date3];
    while (arr.length < n) arr.push('');
    arr[n - 1] = val;
    arr = arr.filter(function (v) { return !!v; });
    it.date = arr[0] || ''; it.date2 = arr[1] || ''; it.date3 = arr[2] || '';
  }

  /** 저장 — 그 회차 수정 / '+ 방문일'이면 slot='push'(오늘을 밀어내기로 추가) */
  function saveDateFromSlot(slotEl) {
    var it = dateItemOf(slotEl);
    if (!it || !slotEl) return;
    var ed = slotEl.querySelector('.vdedit');
    var inp = slotEl.querySelector('.vdate-inp');
    if (!ed || !inp) return;
    var slot = String(ed.dataset.slot || '1');
    var isPush = (slot === 'push');
    var val = String(inp.value || '').trim();
    if (!val && isPush) val = todayStr();      /* + 는 오늘 날짜가 기본값 */
    if (!/^\d{4}-\d{2}-\d{2}$/.test(val)) { toast('날짜를 골라 주세요 (YYYY-MM-DD)'); return; }
    if (!isPush && val === dateOfSlot(it, slot)) { paintDateSlot(slotEl, it); return; }  /* 바뀐 게 없음 */

    sendDates(slotEl, it, val, isPush ? 'push' : Number(slot));
  }

  /** 삭제 — 그 회차만 지운다(남은 날짜는 앞으로 당겨 1차·2차로 채운다) */
  function deleteDateFromSlot(slotEl) {
    var it = dateItemOf(slotEl);
    if (!it || !slotEl) return;
    var ed = slotEl.querySelector('.vdedit');
    if (!ed) return;
    var n = Number(ed.dataset.slot);
    if (!(n >= 1 && n <= 3)) return;
    if (!dateOfSlot(it, n)) { paintDateSlot(slotEl, it); return; }
    sendDates(slotEl, it, '', n, n + '차 방문일을 지웠습니다');
  }

  /** saveVisitDate 호출 공통 — 화면 먼저 반영, 실패하면 원래대로 되돌린다 */
  function sendDates(slotEl, it, val, slot, doneMsg) {
    var key = 'date:' + keyOf(it);
    if (inFlight[key]) return;
    inFlight[key] = true;

    var before = [it.date, it.date2, it.date3];
    if (slot === 'push') pushLocalDate(it, val);
    else setSlotDate(it, slot, val);
    paintDateSlot(slotEl, it);
    refreshDateSlots(it);
    setStatus('busy');

    srv('saveVisitDate', [it.type, it.row, val, slot], function (res) {
      inFlight[key] = false;
      if (!res || res.ok !== true) { revert(res); return; }
      applyDates(it, res);
      refreshDateSlots(it);
      setStatus('saved', res.savedAt || '');
      if (doneMsg) toast(doneMsg);
      if (window.navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
    }, function () {
      inFlight[key] = false;
      revert(null);
    });

    function revert(res) {
      it.date = before[0]; it.date2 = before[1]; it.date3 = before[2];
      refreshDateSlots(it);
      setStatus('failed');
      var msg = (res && res.error) ? String(res.error) : '';
      /* 예전 Apps Script가 배포돼 있으면 '알 수 없는 요청입니다: visitDate'가 온다 —
         화면은 이미 새 것이므로 무엇을 해야 하는지 그대로 알려 준다. */
      if (!msg || msg.indexOf('알 수 없는') >= 0) {
        toast('Apps Script 코드 업데이트 후 배포가 필요합니다');
      } else {
        toast('방문일을 저장하지 못했습니다 · ' + msg);
      }
    }
  }

  /** 그 항목의 알약(목록 카드·지도 하단 카드)을 모두 지금 값으로 다시 그린다 */
  function refreshDateSlots(it) {
    if (!it) return;
    var cards = $('list').querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      if (S.byKey[cards[i].dataset.key] !== it) continue;
      paintDateSlot(cards[i].querySelector('.vdslot'), it);
    }
    if (M.selKey === keyOf(it) && !$('mapcard').hidden) {
      paintDateSlot($('mapcard').querySelector('.vdslot'), it);
    }
  }

  /** 방문일 알약·+·입력칸 클릭 처리 (목록·지도 카드 공통). 처리했으면 true */
  function onDateAreaClick(ev) {
    var t = ev.target;
    var add = t.closest('[data-act="add-date"]');
    if (add) { ev.preventDefault(); openDateEditor(add.closest('.vdslot'), 'push'); return true; }
    var edit = t.closest('[data-act="edit-date"]');
    if (edit) { ev.preventDefault(); openDateEditor(edit.closest('.vdslot'), edit.dataset.slot || '1'); return true; }
    var save = t.closest('[data-act="date-save"]');
    if (save) { ev.preventDefault(); saveDateFromSlot(save.closest('.vdslot')); return true; }
    var del = t.closest('[data-act="date-del"]');
    if (del) { ev.preventDefault(); deleteDateFromSlot(del.closest('.vdslot')); return true; }
    var cancel = t.closest('[data-act="date-cancel"]');
    if (cancel) { ev.preventDefault(); cancelDateEditor(cancel.closest('.vdslot')); return true; }
    /* 날짜 입력칸 안을 누른 것은 완료 체크가 아니라 날짜 고르기로 */
    if (t.closest('.vdedit')) return true;
    return false;
  }

  /** 날짜 입력칸에서 Enter=저장, Esc=취소 */
  function onDateAreaKey(ev) {
    var t = ev.target;
    if (!t || !t.classList || !t.classList.contains('vdate-inp')) return;
    if (ev.key === 'Enter' || ev.keyCode === 13) {
      ev.preventDefault(); saveDateFromSlot(t.closest('.vdslot'));
    } else if (ev.key === 'Escape' || ev.keyCode === 27) {
      ev.preventDefault(); cancelDateEditor(t.closest('.vdslot'));
    }
  }

  function onToggle(card) {
    var key = card.dataset.key;
    var it = S.byKey[key];
    if (!it || inFlight[key]) return;

    var next = !it.checked;
    var before = it.checked;
    var beforeDates = [it.date, it.date2, it.date3];

    /* 낙관적 반영 — 체크 해제면 오늘 날짜 알약도 바로 걷어 낸다(과거 날짜는 그대로) */
    it.checked = next;
    if (it.type === 'regular' && !next) dropTodayLocal(it);
    applyCard(card, it);
    updateSummary();
    card.classList.add('pending');
    setStatus('busy');
    inFlight[key] = true;

    srv('toggleCheck', [it.type, it.row, next, it.type === 'balance' ? 'done' : ''], function (res) {
      inFlight[key] = false;
      card.classList.remove('pending');
      if (!res || res.ok !== true) { rollback(); return; }
      it.checked = (typeof res.checked === 'boolean') ? res.checked : next;
      if (it.type === 'balance') it.done = it.checked;
      /* 정기방문은 체크할 때 오늘 날짜가 3칸 규칙(밀어내기)으로 들어오고,
         같은 날 체크를 풀면 오늘 날짜만 빠지며 과거 방문일은 남는다.
         (잔금_관리의 잔금일은 일정 날짜라 건드리지 않는다) */
      if (it.type === 'regular') applyDates(it, res);
      applyCard(card, it);
      updateSummary();
      syncMapItem(it);
      setStatus('saved', res.savedAt || '');
      if (window.navigator.vibrate) { try { navigator.vibrate(it.checked ? 18 : 10); } catch (e) {} }
    }, function () {
      inFlight[key] = false;
      card.classList.remove('pending');
      rollback();
    });

    function rollback() {
      it.checked = before;
      if (it.type === 'balance') it.done = before;
      it.date = beforeDates[0]; it.date2 = beforeDates[1]; it.date3 = beforeDates[2];
      applyCard(card, it);
      updateSummary();
      syncMapItem(it);
      setStatus('failed');
      toast('체크를 저장하지 못했습니다 · 시트 연결을 확인해 주세요');
    }
  }

  /* ── 잔금후방문 체크 (잔금완료와 독립) ───────────────── */
  function onAfterToggle(card) {
    var key = card.dataset.key;
    var it = S.byKey[key];
    if (!it || it.type !== 'balance') return;
    var ikey = key + ':after';
    if (inFlight[ikey]) return;

    var next = !it.after;
    var before = it.after;
    it.after = next;
    applyCard(card, it);
    updateSummary();
    card.classList.add('pending');
    setStatus('busy');
    inFlight[ikey] = true;

    srv('toggleCheck', ['balance', it.row, next, 'after'], function (res) {
      inFlight[ikey] = false;
      card.classList.remove('pending');
      if (!res || res.ok !== true) { rollback(); return; }
      it.after = (typeof res.checked === 'boolean') ? res.checked : next;
      applyCard(card, it);
      updateSummary();
      setStatus('saved', res.savedAt || '');
      if (window.navigator.vibrate) { try { navigator.vibrate(it.after ? 18 : 10); } catch (e) {} }
      if (it.after) toast('잔금후방문 완료로 체크했습니다');
    }, function () { rollback(); });

    function rollback() {
      inFlight[ikey] = false;
      card.classList.remove('pending');
      it.after = before;
      applyCard(card, it);
      updateSummary();
      setStatus('failed');
      toast('잔금후방문 체크를 저장하지 못했습니다 · 시트 연결을 확인해 주세요');
    }
  }

  /** 지도 핀·하단 카드를 현재 상태에 맞춘다 */
  function syncMapItem(it) {
    if (S.view === 'map' && M.ready) renderMapPinsOnly();
    if (M.selKey === keyOf(it) && !$('mapcard').hidden) showMapCard(it);
  }

  /* ── 메모 ─────────────────────────────────────────── */
  function queueMemo(card, it) {
    var key = card.dataset.key;
    setStatus('editing');
    clearTimeout(memoTimers[key]);
    memoTimers[key] = setTimeout(function () { flushMemo(card, it); }, MEMO_DELAY);
  }

  function flushMemo(card, it) {
    var key = card.dataset.key;
    clearTimeout(memoTimers[key]);
    memoTimers[key] = null;
    if (it.draft === undefined) return;
    var val = it.draft;
    if (val === it.memo) { if (pendingWrites === 0) setStatus('saved'); return; }

    pendingWrites++;
    setStatus('busy');
    srv('saveMemo', [it.type, it.row, val], function (res) {
      pendingWrites--;
      if (!res || res.ok !== true) { revert(); return; }
      it.memo = val;
      if (pendingWrites === 0) setStatus('saved', res.savedAt ? res.savedAt.substr(11, 5) : '');
    }, function () {
      pendingWrites--;
      revert();
    });

    function revert() {
      it.draft = it.memo;
      var input = card.querySelector('.memo');
      if (input) input.value = it.memo;
      setStatus('failed');
      toast('메모를 저장하지 못했습니다 · 다시 입력해 주세요');
    }
  }

  function flushAll() {
    var cards = $('list').querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      var it = S.byKey[cards[i].dataset.key];
      if (it && it.draft !== undefined && memoTimers[cards[i].dataset.key]) flushMemo(cards[i], it);
    }
  }

  /* ── 데이터 불러오기 ──────────────────────────────── */
  function normalize(it) {
    it.draft = undefined;
    /* 잔금 카드는 큰 체크 하나를 '잔금완료'로 쓴다 — 서버의 done 을 checked 로 옮겨 담는다 */
    if (it.type === 'balance') it.checked = !!it.done;
    if (typeof it.checked !== 'boolean') it.checked = (it.checked === true);
    if (it.type === 'balance') it.after = !!it.after;
    if (!it.memo) it.memo = '';
    it.date = normVisitDate(it.date);
    it.date2 = normVisitDate(it.date2);
    it.date3 = normVisitDate(it.date3);
    if (it.lat === undefined) it.lat = null;
    if (it.lng === undefined) it.lng = null;
    return it;
  }

  function loadError(msg) {
    S.loading = false;
    $('boot').hidden = false;
    $('boot-spin').style.display = 'none';
    $('boot-msg').className = 'err';
    $('boot-msg').textContent = '시트를 불러오지 못했습니다' + (msg ? '\n' + msg : '');
    $('boot-retry').classList.add('on');
    setStatus('offline');
  }

  function fetchBoard(done) {
    var locked = $('lock') && !$('lock').hidden;
    var finish = function (ok) { if (typeof done === 'function') done(ok); };
    S.loading = true;
    if (!locked) {
      $('boot').hidden = false;
      $('boot-spin').style.display = '';
      $('boot-msg').className = '';
      $('boot-msg').textContent = '시트에서 불러오는 중…';
      $('boot-retry').classList.remove('on');
    }
    setStatus('busy', '시트에서 불러오는 중…');

    srv('getBoardData', [], function (res) {
      if (!res || res.ok !== true) {
        if (locked) { $('lock-err').textContent = (res && res.error) || '연결에 실패했습니다'; finish(false); }
        else loadError(res && res.error);
        return;
      }
      S.reg = (res.regular || []).map(normalize);
      S.bal = (res.balance || []).map(normalize);
      S.balMissing = (res.balance === undefined || res.balance === null);
      sortBal();
      S.byKey = {};
      S.reg.concat(S.bal).forEach(function (it) { S.byKey[keyOf(it)] = it; });
      buildSeq();
      S.summary = res.summary || null;
      S.fetchedAt = res.fetchedAt || '';
      S.loading = false;
      S.ready = true;
      $('boot').hidden = true;
      $('lock').hidden = true;
      render();
      setStatus('ready');
      if (res.summary) {
        $('foot').textContent = '정기방문_체크표 ' + S.reg.length + '곳 + 잔금_관리 ' +
          S.bal.length + '건 · 불러온 시각 ' + S.fetchedAt.substr(11, 5);
      }
      /* 지도 탭으로 들어왔고 좌표가 있으면 바로 지도 준비 */
      if (S.view === 'map' && S.tab !== '잔금') initMap();
      finish(true);
    }, function (err) {
      if (err && err.auth) { finish(false); return; }
      var msg = err && err.message ? err.message : '';
      if (locked) {
        $('lock-err').textContent = '연결에 실패했습니다. 잠시 후 다시 시도해 주세요.' + (msg ? '\n(' + msg + ')' : '');
        setStatus('offline');
        finish(false);
      } else {
        loadError(msg);
      }
    });
  }

  /* ── 이벤트 ───────────────────────────────────────── */
  $('list').addEventListener('click', function (ev) {
    /* 중개사 상호 → 잔금 이력 팝업 (완료 체크보다 먼저 처리: 이름이 카드 윗줄 안에 있다) */
    var nmBtn = ev.target.closest('[data-act="hist"]');
    if (nmBtn && $('list').contains(nmBtn)) {
      ev.preventDefault();
      var hcard = nmBtn.closest('.card');
      var hit = hcard ? S.byKey[hcard.dataset.key] : null;
      openHistory((hit && (hit.name || hit.broker)) || nmBtn.textContent);
      return;
    }
    /* 잔금후방문 체크 → 별도 체크 토글(잔금완료와 다른 칸) */
    var aftBtn = ev.target.closest('[data-act="after"]');
    if (aftBtn) {
      ev.preventDefault();
      var acard = aftBtn.closest('.card');
      if (acard) onAfterToggle(acard);
      return;
    }
    /* 방문일 알약 → 날짜 입력칸 / 저장 / 취소 (완료 체크와 겹치지 않게 먼저 처리) */
    if (onDateAreaClick(ev)) return;
    /* 카드의 [지도] — 앱 안 지도 탭으로 전환해 그 중개사 핀으로 확대·이동 */
    var mapBtn = ev.target.closest('[data-act="inappmap"]');
    if (mapBtn) {
      ev.preventDefault();
      var mcard = mapBtn.closest('.card');
      var mit = mcard ? S.byKey[mcard.dataset.key] : null;
      if (mit && canMapInApp(mit)) { openInAppMap(mit); return; }
      if (mapBtn.href) location.href = mapBtn.href;   /* 좌표를 못 읽으면 카카오맵 링크로 */
      return;
    }
    var top = ev.target.closest('[data-act="toggle"]');
    if (!top) return;
    onToggle(top.closest('.card'));
  });

  $('list').addEventListener('keydown', onDateAreaKey);

  $('list').addEventListener('input', function (ev) {
    if (!ev.target.classList || !ev.target.classList.contains('memo')) return;
    var card = ev.target.closest('.card');
    var it = S.byKey[card.dataset.key];
    if (!it) return;
    it.draft = ev.target.value;
    queueMemo(card, it);
  });

  $('list').addEventListener('focusout', function (ev) {
    if (!ev.target.classList || !ev.target.classList.contains('memo')) return;
    var card = ev.target.closest('.card');
    var it = S.byKey[card.dataset.key];
    if (it && it.draft !== undefined) flushMemo(card, it);
  });

  $('tabs').addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (!tab) return;
    flushAll();
    var prevTab = S.tab;
    S.tab = tab.dataset.tab;
    /* 탭이 바뀌면 앞 탭에서 열어 둔 지도 하단 카드를 닫는다 — 새 탭 화면에 남지 않게.
       (잔금 탭으로 갈 때뿐 아니라 전체↔1~4주차 어디로 옮겨도 동일하게 적용) */
    if (S.tab !== prevTab) closeMapCard();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('viewtog').addEventListener('click', function (ev) {
    var b = ev.target.closest('.vt');
    if (!b) return;
    var v = b.dataset.view;
    if (v === S.view) return;
    flushAll();
    /* 목록으로 돌아갈 때는 '지도에서 보던 중개사'를 먼저 기억해 두었다가 그 카드로 바로 맞춘다
       (목록에서 [지도]로 넘어간 경우든, 지도에서 다른 핀을 눌러 본 경우든) */
    var backKey = (v === 'list') ? M.selKey : '';
    S.view = v;
    Array.prototype.forEach.call(document.querySelectorAll('#viewtog .vt'), function (x) {
      x.classList.toggle('on', x.dataset.view === v);
    });
    /* 목록으로 넘어가면 지도 하단 카드도 함께 닫는다 — 닫으면서 M.selKey 가 비므로 그 전에 기억 */
    if (v === 'list') closeMapCard();
    render();
    if (v === 'list') {
      /* 고른 핀이 있었으면 그 중개사 카드를 화면 가운데로, 없었으면 예전처럼 맨 위로 */
      if (!scrollListToKey(backKey)) window.scrollTo(0, 0);
    }
    if (v === 'map') {
      /* 숨어 있던 동안 잃은 크기를 되찾아 타일이 잘리지 않게 한다 */
      if (M.ready && M.map) {
        try { M.map.relayout(); } catch (e) {}
        setTimeout(function () {
          if (S.view !== 'map' || !M.ready || !M.map || !mapVisible()) return;
          try { M.map.relayout(); } catch (e) {}
        }, 150);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  var qTimer = null;
  $('q').addEventListener('input', function (ev) {
    var v = ev.target.value.trim().toLowerCase();
    $('q-clear').classList.toggle('on', !!ev.target.value);
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { flushAll(); S.q = v; render(); }, 120);
  });

  $('q-clear').addEventListener('click', function () {
    $('q').value = '';
    $('q-clear').classList.remove('on');
    flushAll();
    S.q = '';
    render();
    $('q').focus();
  });

  $('mapcard').addEventListener('click', onDateAreaClick);
  $('mapcard').addEventListener('click', function (ev) {
    /* 지도 카드의 중개사 상호 → 잔금 이력 팝업 */
    var nmBtn = ev.target.closest('[data-act="hist"]');
    if (!nmBtn) return;
    ev.preventDefault();
    var hit = M.selKey ? S.byKey[M.selKey] : null;
    openHistory((hit && hit.name) || nmBtn.textContent);
  });
  $('hist-x').addEventListener('click', closeHistory);
  $('hist-bg').addEventListener('click', closeHistory);
  document.addEventListener('keydown', function (ev) {
    if ((ev.key === 'Escape' || ev.key === 'Esc') && !$('histwrap').hidden) closeHistory();
  });
  $('mapcard').addEventListener('keydown', onDateAreaKey);

  /* 지도 하단 카드 */
  function closeMapCard() {
    M.selKey = '';
    $('mapcard').hidden = true;
    document.body.classList.remove('mc-open');
    fitMapBox();          /* 지도를 원래 높이로 되돌린다 */
    if (M.ready && M.map && mapVisible()) { try { M.map.relayout(); } catch (e) {} }
    if (M.ready) renderMapPinsOnly();
  }
  $('mc-x').addEventListener('click', closeMapCard);

  /* 내 위치 버튼 */
  $('myloc').addEventListener('click', onMyLocClick);
  setMyLocBtn();

  /* 앱을 벗어나면 추적 중지, 돌아오면 재개 */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopMyLoc(); return; }
    if (S.view === 'map' && S.tab !== '잔금' && M.ready) startMyLoc();
  });

  $('mc-done').addEventListener('click', function () {
    var it = S.byKey[M.selKey];
    if (!it) return;
    var btn = $('mc-done');
    if (btn.disabled) return;
    var next = !it.checked;
    var before = it.checked;
    var beforeDates = [it.date, it.date2, it.date3];
    it.checked = next;
    if (it.type === 'regular' && !next) dropTodayLocal(it);
    showMapCard(it);
    renderMapPinsOnly();
    updateSummary();
    btn.disabled = true;
    setStatus('busy');
    inFlight[M.selKey] = true;
    srv('toggleCheck', [it.type, it.row, next], function (res) {
      inFlight[M.selKey] = false;
      btn.disabled = false;
      if (!res || res.ok !== true) { rollback(); return; }
      it.checked = (typeof res.checked === 'boolean') ? res.checked : next;
      /* 정기방문은 체크할 때 오늘 날짜가 3칸 규칙(밀어내기)으로 들어오고,
         같은 날 체크를 풀면 오늘 날짜만 빠지며 과거 방문일은 남는다.
         (잔금_관리의 잔금일은 일정 날짜라 건드리지 않는다) */
      if (it.type === 'regular') applyDates(it, res);
      showMapCard(it);
      renderMapPinsOnly();
      updateSummary();
      setStatus('saved', res.savedAt || '');
      if (window.navigator.vibrate) { try { navigator.vibrate(it.checked ? 18 : 10); } catch (e) {} }
    }, function () {
      inFlight[M.selKey] = false;
      btn.disabled = false;
      rollback();
    });
    function rollback() {
      it.checked = before;
      it.date = beforeDates[0]; it.date2 = beforeDates[1]; it.date3 = beforeDates[2];
      showMapCard(it);
      renderMapPinsOnly();
      updateSummary();
      setStatus('failed');
      toast('체크를 저장하지 못했습니다 · 시트 연결을 확인해 주세요');
    }
  });

  $('reload').addEventListener('click', function () {
    flushAll();
    M.selKey = '';
    $('mapcard').hidden = true;
    if (M.map) { try { M.map = null; } catch (e) {} M.ready = false; }
    fetchBoard();
  });

  $('boot-retry').addEventListener('click', fetchBoard);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushAll();
  });
  window.addEventListener('pagehide', flushAll);
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    if (M.ready && M.map) {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        try { M.map.relayout(); if (S.view === 'map') renderMap(); } catch (e) {}
      }, 120);
    }
  });
  /* 카드 내용(이름 줄바꿈·주소)이나 화면 회전으로 카드 높이가 바뀌면 지도 높이도 같이 맞춘다 */
  if (window.ResizeObserver) {
    try {
      new ResizeObserver(function () { fitMapBox(); }).observe($('mapcard'));
    } catch (e) {}
  }

  /* ── 시작 ─────────────────────────────────────────── */
  var d = new Date();
  $('badge').textContent = d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2);

  /* 상단 2026.11 배지: 글자 잉크를 배지 안의 시각적 정중앙에 맞춘다.
     글자 위아래에는 항상 더 많은 빈 공간(하강부·줄간격)이 생겨 고정 padding으로는 기기마다 글자가 위로 뜬다.
     최신 브라우저는 CSS의 text-box-trim이 글자 상자(대문자 높이~베이스라인)만 남기므로 CSS만으로 정중앙이 된다.
     아래 계산은 text-box-trim을 모르는 브라우저용 대비책으로, 같은 글꼴의 줄 높이·베이스라인·글자 잉크를 재서 위·아래 여백을 같게 만든다. */
  function centerBadge() {
    var el = $('badge');
    try {
      if (!el || !el.textContent) return;
      if (window.CSS && CSS.supports && CSS.supports('text-box-trim', 'trim-both') && CSS.supports('text-box-edge', 'cap alphabetic')) return;
      var cs = getComputedStyle(el);
      var lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize);
      var fs = parseFloat(cs.fontSize) || 10.5;
      var c = document.createElement('canvas').getContext('2d');
      if (!c) return;
      /* 글자 잉크 높이는 작은 크기에서 정수로 딸려 오므로 10배로 재서 나눈다 */
      c.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + (fs * 10) + 'px ' + cs.fontFamily;
      var m = c.measureText(el.textContent);
      if (!m || !isFinite(m.actualBoundingBoxAscent) || !isFinite(m.fontBoundingBoxAscent)) return;
      var fAsc = m.fontBoundingBoxAscent / 10, fDesc = m.fontBoundingBoxDescent / 10;
      var inkAsc = m.actualBoundingBoxAscent / 10, inkDesc = m.actualBoundingBoxDescent / 10;
      var base = (lh - (fAsc + fDesc)) / 2 + fAsc;          /* 줄 위 → 글자 베이스라인 */
      var K = 13;                                           /* 위+아래 여백 합계(배지 높이 유지: 10.5 + 13 + 테두리 2 = 25.5px) */
      var d2 = lh - 2 * base - inkDesc + inkAsc;            /* (위 여백) - (아래 여백) */
      el.style.paddingTop = ((K + d2) / 2).toFixed(2) + 'px';
      el.style.paddingBottom = ((K - d2) / 2).toFixed(2) + 'px';
    } catch (e) {}
  }
  centerBadge();
  Array.prototype.forEach.call(document.querySelectorAll('#viewtog .vt'), function (x) {
    x.classList.toggle('on', x.dataset.view === S.view);
  });

  $('lock-go').addEventListener('click', tryUnlock);
  $('lock-pass').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.keyCode === 13) { ev.preventDefault(); tryUnlock(); }
  });
  $('lock-btn').addEventListener('click', function () {
    flushAll();
    lockOut('비밀번호를 다시 입력해 주세요');
  });

  /* 기기에 저장된 비밀번호가 있으면 바로, 없으면 잠금 화면부터 */
  if (PASS) fetchBoard();
  else showLock('');
})();

/* 홈 화면 웹앱(standalone) 인식용 최소 서비스워커 등록 — 캐시 없이 네트워크 직통 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* 미지원·차단 시 조용히 무시 */ });
  });
}
</script>
</body>
</html>
